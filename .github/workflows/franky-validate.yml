name: Control-plane validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'AGENTS.md'
      - 'agents/**'
      - 'skills/**'
      - 'workflows/**'
      - 'ops/**'
      - '.github/workflows/franky-validate.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'agents/**'
      - 'skills/**'
      - 'workflows/**'
      - 'ops/**'
      - '.github/workflows/franky-validate.yml'

permissions:
  contents: read

concurrency:
  group: control-plane-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install 'pyyaml>=6,<7'

      - name: Validate skill interfaces
        id: skills
        run: python skills/franky-maintenance/scripts/validate_skill_interfaces.py skills

      - name: Validate agent adapters
        id: agents
        run: |
          for agent in agents/*.toml; do
            test ! -s "$agent" || python skills/franky-agent-installer/scripts/validate_agent_toml.py "$agent"
          done

      - name: Validate workflow layout
        id: layout
        run: python skills/franky-maintenance/scripts/validate_workflow_layout.py workflows/franky

      - name: Validate canonical workflow contracts
        id: contracts
        run: python skills/franky-workflow-organizer/scripts/validate_workflow.py workflows/franky/franky.yaml

      - name: Validate agent changelog
        id: changelog
        run: python skills/franky-maintenance/scripts/validate_agent_changelog.py agents

      - name: Validate canonical workflow/job IO and cache policy
        id: io_cache
        run: |
          python skills/franky-maintenance/scripts/validate_io_cache.py workflows/franky/franky.yaml
          for workflow in workflows/franky/franky-install/*.yaml workflows/franky/franky-maintenance/*.yaml workflows/franky/general-workflow-factory/*.yaml; do
            python skills/franky-maintenance/scripts/validate_io_cache.py "$workflow"
          done

      - name: Validate audit-record template
        id: audit
        run: python skills/franky-maintenance/scripts/validate_audit_record.py skills/franky-maintenance/templates/audit-record.yaml

      - name: Validate scheduled maintenance definition
        id: scheduler
        run: python skills/franky-maintenance/scripts/validate_scheduler.py ops/schedulers/franky-personal-skill-maintenance.yaml

      - name: Validate session inventory fixture
        id: inventory
        run: python skills/franky-maintenance/scripts/run_session_inventory.py --root . --sessions-dir skills/franky-maintenance/scripts/fixtures --since-hours 24

      - name: Validate adaptive file-first bootstrap
        id: bootstrap
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s ops/scripts/tests -v

      - name: Validate Git allowlist
        id: allowlist
        run: python skills/franky-maintenance/scripts/validate_git_allowlist.py .

      - name: Write validation summary
        if: always()
        run: |
          {
            echo '## Control-plane validation'
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo '| Skill interfaces | ${{ steps.skills.outcome }} |'
            echo '| Agent adapters | ${{ steps.agents.outcome }} |'
            echo '| Workflow layout | ${{ steps.layout.outcome }} |'
            echo '| Canonical workflow contracts | ${{ steps.contracts.outcome }} |'
            echo '| Agent changelog | ${{ steps.changelog.outcome }} |'
            echo '| Canonical workflow IO/cache | ${{ steps.io_cache.outcome }} |'
            echo '| Audit record | ${{ steps.audit.outcome }} |'
            echo '| Scheduler definition | ${{ steps.scheduler.outcome }} |'
            echo '| Session inventory fixture | ${{ steps.inventory.outcome }} |'
            echo '| Adaptive file-first bootstrap | ${{ steps.bootstrap.outcome }} |'
            echo '| Git allowlist | ${{ steps.allowlist.outcome }} |'
            echo
            echo 'Legacy/retired root workflow files are not validated as canonical contracts.'
            echo 'Optional external skills may be unresolved in CI only when their workflow step is explicitly conditional; required workflow-step skills must resolve from repository or configured skill roots.'
            echo 'Personal scheduled-scope enforcement remains a local-runtime check because it depends on the actual Codex personal skill root.'
          } >> "$GITHUB_STEP_SUMMARY"
