name: Control-plane validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'AGENTS.md'
      - 'agents/**'
      - 'skills/**'
      - 'manifests/skill-catalog.yaml'
      - 'manifests/skill-evidence.yaml'
      - 'ops/**'
      - '.github/workflows/franky-validate.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'agents/**'
      - 'skills/**'
      - 'ops/**'
      - '.github/workflows/franky-validate.yml'

permissions:
  contents: read

concurrency:
  group: control-plane-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install 'pyyaml>=6,<7'

      - name: Validate skill interfaces
        id: skills
        run: python skills/control-plane-audit/scripts/validate_skill_interfaces.py skills

      - name: Validate skill catalog admission and utility evidence
        id: skill_catalog
        run: python skills/control-plane-audit/scripts/validate_skill_catalog.py . manifests/skill-catalog.yaml

      - name: Validate behavioral skill evidence envelope
        id: skill_evidence
        run: python skills/control-plane-audit/scripts/validate_skill_evidence.py manifests/skill-evidence.yaml

      - name: Validate tracked skill quality
        id: skill_quality
        run: |
          while IFS= read -r skill_md; do
            skill_dir="${skill_md%/SKILL.md}"
            PYTHONDONTWRITEBYTECODE=1 python skills/control-plane-audit/scripts/validate_skill_quality.py "$skill_dir"
          done < <(git ls-files 'skills/*/SKILL.md')

      - name: Validate on-demand skill interfaces and quality
        id: on_demand_quality
        run: |
          python skills/control-plane-audit/scripts/validate_skill_interfaces.py ops/on-demand-skills
          while IFS= read -r skill_md; do
            skill_dir="${skill_md%/SKILL.md}"
            PYTHONDONTWRITEBYTECODE=1 python skills/control-plane-audit/scripts/validate_skill_quality.py "$skill_dir"
          done < <(git ls-files 'ops/on-demand-skills/*/SKILL.md')

      - name: Validate agent adapters
        id: agents
        run: |
          for agent in agents/*.toml; do
            test ! -s "$agent" || python skills/runtime-adapter-management/scripts/validate_agent_toml.py "$agent"
          done

      - name: Validate static skill-routing fixture
        id: routing
        run: python skills/control-plane-audit/scripts/validate_skill_routing.py . skills/control-plane-audit/scripts/fixtures/skill-routing.yaml

      - name: Validate agent changelog
        id: changelog
        run: python skills/control-plane-audit/scripts/validate_agent_changelog.py agents

      - name: Validate canonical task contract
        id: task_contract
        run: |
          python ops/scripts/validate_task_contract.py ops/schemas/examples/task-contract.yaml
          python ops/scripts/validate_task_contract.py ops/schemas/examples/context-acquisition-task.yaml

      - name: Validate Franky v1 task/result contracts and repertoires
        id: franky_contracts
        run: python ops/scripts/validate_franky_contracts.py

      - name: Validate Codex global agent settings contract
        id: codex_runtime_config
        run: python ops/scripts/validate_codex_runtime_config.py ops/schemas/examples/codex-agents-settings.toml

      - name: Evaluate Franky agent contract cases
        id: franky_agent_eval
        run: python ops/scripts/evaluate_franky_agent.py ops/scripts/fixtures/franky-agent-evaluation.yaml

      - name: Run Franky contract and runtime tests
        id: franky_tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s ops/scripts/tests -v

      - name: Probe installed Codex runtime contract
        id: codex_runtime_probe
        run: python ops/scripts/probe_codex_agent_runtime.py

      - name: Validate bounded context packet
        id: context_packet
        run: |
          python ops/scripts/acquire_context_packet.py \
            --root . \
            --canonical AGENTS.md \
            --canonical documentation/CURRENT.md \
            --evidence documentation/DECISIONS.md \
            --uncertainty 'host adapter trace is not exposed' > /tmp/context-packet.json
          python -m json.tool /tmp/context-packet.json >/dev/null

      - name: Validate audit-record template
        id: audit
        run: python skills/control-plane-audit/scripts/validate_audit_record.py skills/control-plane-audit/templates/audit-record.yaml

      - name: Validate scheduled maintenance definition
        id: scheduler
        run: python skills/control-plane-audit/scripts/validate_scheduler.py ops/schedulers/franky-personal-skill-maintenance.yaml

      - name: Validate session inventory fixture
        id: inventory
        run: python skills/control-plane-audit/scripts/run_session_inventory.py --root . --sessions-dir skills/control-plane-audit/scripts/fixtures --since-hours 24

      - name: Validate adaptive file-first bootstrap
        id: bootstrap
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s skills/project-bootstrap/tests -v

      - name: Validate generic project-link capability
        id: project_link
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s ops/on-demand-skills/install-project-link/tests -v

      - name: Validate maintenance skill tests
        id: routing_tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s skills/control-plane-audit/tests -v

      - name: Validate Git allowlist
        id: allowlist
        run: python skills/control-plane-audit/scripts/validate_git_allowlist.py .

      - name: Write validation summary
        if: always()
        run: |
          {
            echo '## Control-plane validation'
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo '| Skill interfaces | ${{ steps.skills.outcome }} |'
            echo '| Skill catalog admission | ${{ steps.skill_catalog.outcome }} |'
            echo '| Behavioral skill evidence envelope | ${{ steps.skill_evidence.outcome }} |'
            echo '| Tracked skill quality | ${{ steps.skill_quality.outcome }} |'
            echo '| On-demand skill quality | ${{ steps.on_demand_quality.outcome }} |'
            echo '| Agent adapters | ${{ steps.agents.outcome }} |'
            echo '| Static skill-routing fixture | ${{ steps.routing.outcome }} |'
            echo '| Agent changelog | ${{ steps.changelog.outcome }} |'
            echo '| Task contract | ${{ steps.task_contract.outcome }} |'
            echo '| Franky v1 contracts and repertoires | ${{ steps.franky_contracts.outcome }} |'
            echo '| Codex global agent settings | ${{ steps.codex_runtime_config.outcome }} |'
            echo '| Franky agent contract evaluation | ${{ steps.franky_agent_eval.outcome }} |'
            echo '| Franky contract and runtime tests | ${{ steps.franky_tests.outcome }} |'
            echo '| Codex runtime contract probe | ${{ steps.codex_runtime_probe.outcome }} |'
            echo '| Bounded context packet | ${{ steps.context_packet.outcome }} |'
            echo '| Audit record | ${{ steps.audit.outcome }} |'
            echo '| Scheduler definition | ${{ steps.scheduler.outcome }} |'
            echo '| Session inventory fixture | ${{ steps.inventory.outcome }} |'
            echo '| Adaptive file-first bootstrap | ${{ steps.bootstrap.outcome }} |'
            echo '| Generic project-link capability | ${{ steps.project_link.outcome }} |'
            echo '| Skill-routing fixture tests | ${{ steps.routing_tests.outcome }} |'
            echo '| Git allowlist | ${{ steps.allowlist.outcome }} |'
            echo
            echo 'Legacy/retired root workflow files are not validated as canonical contracts.'
            echo 'Optional external skills may be unresolved in CI only when their workflow step is explicitly conditional; required workflow-step skills must resolve from repository or configured skill roots.'
            echo 'Personal scheduled-scope enforcement remains a local-runtime check because it depends on the actual Codex personal skill root.'
          } >> "$GITHUB_STEP_SUMMARY"
