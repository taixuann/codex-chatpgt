name: Control-plane validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'AGENTS.md'
      - 'agents/**'
      - 'skills/**'
      - 'workflows/**'
      - 'ops/**'
      - '.github/workflows/franky-validate.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'agents/**'
      - 'skills/**'
      - 'workflows/**'
      - 'ops/**'
      - '.github/workflows/franky-validate.yml'

permissions:
  contents: read

concurrency:
  group: control-plane-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install validation dependency
        run: python -m pip install 'pyyaml>=6,<7'

      - name: Validate skill interfaces
        id: skills
        run: python skills/franky-maintenance/scripts/validate_skill_interfaces.py skills

      - name: Validate agent adapters
        id: agents
        run: |
          for agent in agents/*.toml; do
            test ! -s "$agent" || python skills/franky-agent-installer/scripts/validate_agent_toml.py "$agent"
          done

      - name: Validate workflow layout
        id: layout
        run: python skills/franky-maintenance/scripts/validate_workflow_layout.py workflows/franky

      - name: Validate workflow contracts
        id: contracts
        run: |
          for workflow in workflows/franky/*.yaml; do
            python skills/franky-workflow-organizer/scripts/validate_workflow.py "$workflow"
          done
          for workflow in workflows/franky/franky-install/*.yaml workflows/franky/franky-maintenance/*.yaml; do
            python skills/franky-workflow-organizer/scripts/validate_workflow.py "$workflow"
          done

      - name: Validate agent changelog
        id: changelog
        run: python skills/franky-maintenance/scripts/validate_agent_changelog.py agents

      - name: Validate workflow/job IO and cache policy
        id: io_cache
        run: |
          for workflow in workflows/franky/*.yaml workflows/franky/franky-install/*.yaml workflows/franky/franky-maintenance/*.yaml; do
            python skills/franky-maintenance/scripts/validate_io_cache.py "$workflow"
          done

      - name: Validate audit-record template
        id: audit
        run: python skills/franky-maintenance/scripts/validate_audit_record.py skills/franky-maintenance/templates/audit-record.yaml

      - name: Validate scheduled maintenance definition
        id: scheduler
        run: python skills/franky-maintenance/scripts/validate_scheduler.py ops/schedulers/franky-personal-skill-maintenance.yaml

      - name: Validate session inventory fixture
        id: inventory
        run: python skills/franky-maintenance/scripts/run_session_inventory.py --root . --sessions-dir skills/franky-maintenance/scripts/fixtures --since-hours 24

      - name: Validate scheduled personal-skill scope
        id: scheduled_scope
        run: python skills/franky-maintenance/scripts/validate_scheduled_scope.py skills/franky-maintenance

      - name: Validate Git allowlist
        id: allowlist
        run: python skills/franky-maintenance/scripts/validate_git_allowlist.py .

      - name: Write validation summary
        if: always()
        run: |
          {
            echo '## Control-plane validation'
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo '| Skill interfaces | ${{ steps.skills.outcome }} |'
            echo '| Agent adapters | ${{ steps.agents.outcome }} |'
            echo '| Workflow layout | ${{ steps.layout.outcome }} |'
            echo '| Workflow contracts | ${{ steps.contracts.outcome }} |'
            echo '| Agent changelog | ${{ steps.changelog.outcome }} |'
            echo '| Workflow IO/cache | ${{ steps.io_cache.outcome }} |'
            echo '| Audit record | ${{ steps.audit.outcome }} |'
            echo '| Scheduler | ${{ steps.scheduler.outcome }} |'
            echo '| Session inventory | ${{ steps.inventory.outcome }} |'
            echo '| Scheduled scope | ${{ steps.scheduled_scope.outcome }} |'
            echo '| Git allowlist | ${{ steps.allowlist.outcome }} |'
            echo
            echo 'Optional external skills are not required for repository CI. Required workflow-step skills must resolve from the repository or configured skill roots.'
          } >> "$GITHUB_STEP_SUMMARY"
