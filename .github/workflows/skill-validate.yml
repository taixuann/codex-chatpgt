name: Skill validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'AGENTS.md'
      - 'agents/**'
      - 'skills/**'
      - '.github/workflows/skill-validate.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'agents/**'
      - 'skills/**'
      - '.github/workflows/skill-validate.yml'

permissions:
  contents: read

concurrency:
  group: skill-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install 'pyyaml>=6,<7'

      - name: Validate retained agent adapters
        run: >-
          python -c "import glob,pathlib,tomllib; paths=sorted(glob.glob('agents/*.toml')); names=[pathlib.Path(p).stem for p in paths]; assert names == ['athena', 'franky', 'prometheus'], names; [tomllib.load(open(p, 'rb')) for p in paths]"

      - name: Validate skill-creator package
        run: |
          python skills/skill-creator/scripts/quick_validate.py skills/skill-creator
          python skills/skill-creator/scripts/validate_eval_cases.py skills/skill-creator/evals/cases.yaml
          python -m unittest skills/skill-creator/scripts/test_validate_eval_cases.py
