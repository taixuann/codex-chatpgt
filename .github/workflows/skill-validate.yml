name: Skill validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'AGENTS.md'
      - 'agents/**'
      - 'skills/**'
      - '.github/workflows/skill-validate.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'agents/**'
      - 'skills/**'
      - '.github/workflows/skill-validate.yml'

permissions:
  contents: read

concurrency:
  group: skill-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install 'pyyaml>=6,<7'

      - name: Validate retained agent adapters
        run: >-
          python -c "import glob,pathlib,tomllib; paths=sorted(glob.glob('agents/*.toml')); names=[pathlib.Path(p).stem for p in paths]; assert names == ['athena', 'franky', 'prometheus'], names; [tomllib.load(open(p, 'rb')) for p in paths]"

      - name: Validate reduced active tree
        run: |
          test ! -d documentation
          test ! -d manifests
          test ! -d ops
          test ! -d plans
          test ! -d skills/references
          test ! -e skills/ADDYOSMANI-AGENT-SKILLS-LICENSE
          test ! -e agents/README.md
          test ! -e agents/CHANGELOG.md
          test "$(git ls-files 'skills/**/SKILL.md' | wc -l | tr -d ' ')" -eq 2
          test "$(git ls-files 'agents/*.toml' | wc -l | tr -d ' ')" -eq 3

      - name: Validate repository references and retained provenance
        run: |
          ! git grep -n -E '(^|[[:space:]])(documentation|manifests|ops|plans)/' -- AGENTS.md README.md agents skills .github
          test "$(git rev-parse refs/remotes/origin/archive/pre-minimal-kernel-v2)" = "159b8102229503ebe404535dc6b2a1ee298436cf"
          python - <<'PY'
          import subprocess
          expected = {
              'skills/skill-creator/scripts/generate_openai_yaml.py': '870eefcea9bd0184806b8eb305526e883d2f7241',
              'skills/skill-creator/scripts/init_skill.py': '2ed2fa3125c720fcce60a29f3dd82d04b14d9fa0',
              'skills/skill-creator/scripts/quick_validate.py': 'e27023ece4bd259ef36560e19995eec7b6a345bf',
              'skills/skill-creator/license.txt': 'd645695673349e3947e8e5ae42332d0ac3164cd7',
          }
          for path, blob in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == blob, (path, actual, blob)
          PY
          git diff --check origin/main...HEAD

      - name: Validate skill-creator package
        run: |
          python skills/skill-creator/scripts/quick_validate.py skills/skill-creator
          python skills/skill-creator/scripts/validate_eval_cases.py skills/skill-creator/evals/cases.yaml
          python -m unittest skills/skill-creator/scripts/test_validate_eval_cases.py

      - name: Validate agent-creator package and qualification manifest
        run: |
          python skills/skill-creator/scripts/quick_validate.py skills/agent-creator
          python -m py_compile skills/agent-creator/scripts/*.py
          python skills/agent-creator/scripts/validate_qualification_receipts.py skills/agent-creator/references/qualification-receipts.jsonl --exclusions skills/agent-creator/references/qualification-exclusions.jsonl
          python -m unittest skills/agent-creator/scripts/test_validate_qualification_receipts.py
          python -m unittest skills/agent-creator/scripts/test_role_contracts.py
          python - <<'PY'
          import json, pathlib, yaml
          cases = yaml.safe_load(pathlib.Path('skills/agent-creator/references/qualification-cases.yaml').read_text())
          assert cases['skill'] == 'agent-creator'
          assert cases['runtime_signals']['discovery_listing'] == 'OBSERVED'
          assert cases['runtime_signals']['explicit_delegation'] == 'NOT_ASSESSED'
          assert cases['runtime_signals']['role_selection'] == 'NOT_ASSESSED'
          assert cases['runtime_signals']['role_application'] == 'NOT_ASSESSED'
          assert cases['runtime_signals']['per_turn_skill_load'] == 'NOT_ASSESSED'
          assert cases['synthetic_probe']['fixture'] == 'synthetic_only'
          assert cases['synthetic_probe']['explicit_delegation'] == 'OBSERVED'
          assert cases['synthetic_probe']['role_identity'] == 'OBSERVED'
          assert len(cases['cases']) == 3 and len(cases['routing_cases']) == 7
          assert all(case['admission']['expected_runs'] == 10 for case in cases['cases'])
          baseline = json.loads(pathlib.Path('skills/agent-creator/references/qualification-baseline.json').read_text())
          assert baseline['repository'] == 'jscraik/Agent-Skills'
          assert baseline['ref'] == 'd00c351fe53460afba860f8cdb1580d7cfece7e4'
          assert baseline['license'] == 'Apache-2.0'
          assert baseline['quick_validate'] == 'PASS'
          assert baseline['current_eval_contract'] == 'EXPECTED_FAIL_CLOSED'
          native = json.loads(pathlib.Path('skills/agent-creator/references/qualification-native-runtime.json').read_text())
          assert native['fixture'] == 'synthetic_only'
          assert native['collab_spawn_event'] == 'OBSERVED'
          assert native['child_parent_relation'] == 'OBSERVED'
          assert native['role_identity'] == 'OBSERVED'
          assert native['return_completion'] == 'OBSERVED'
          assert native['requested_model'] == 'gpt-5.6-luna'
          assert native['requested_reasoning_effort'] == 'medium'
          discovery = json.loads(pathlib.Path('skills/agent-creator/references/qualification-discovery.json').read_text())
          assert discovery['default_repo_skill_match_count'] == 0
          assert discovery['explicit_extra_root_match_count'] == 1
          assert discovery['explicit_extra_root_discovery'] == 'OBSERVED'
          assert discovery['activation_status'] == 'NOT_ASSESSED'
          PY
