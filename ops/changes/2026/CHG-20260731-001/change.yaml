id: CHG-20260731-001
title: Replace primary Lavish plan review with Plannotator and Markdown contracts
status: accepted-locally
requested_by: user
scope:
  add:
    - Plannotator v0.25.1 binary at /Users/tai/.local/bin/plannotator
  modify:
    - /Users/tai/.codex/hooks.json
    - /Users/tai/.codex/skills/goal-session/scripts/init_goal_session.py
    - /Users/tai/.codex/skills/goal-session/SKILL.md
    - /Users/tai/.codex/skills/franky-goal-session/references/templates/PLAN.md
    - /Users/tai/.codex/skills/franky-goal-session/SKILL.md
    - /Users/tai/ai-labs/ops/skills/shared.execution/shared-autonomous-ai-agent/SKILL.md
    - /Users/tai/ai-labs/ops/skills/shared.session/goal-session/scripts/init_goal_session.py
exclude:
  - removal of existing .lavish artifacts
  - changes to workflow ordering or approval semantics
  - automatic commit or push
  - optional Plannotator skills
behavior:
  before: Codex SessionStart launched lavish-axi; generated plan examples pointed to .lavish HTML.
  after: Plannotator runs from the Codex Stop hook; generated plans are Markdown execution contracts with explicit steps, inputs, outputs, acceptance, stop conditions, and result sections.
validation:
  - Plannotator binary reports v0.25.1.
  - Plannotator installer SHA256 verification passed.
  - Codex hooks retain Stop -> /Users/tai/.local/bin/plannotator and no longer contain SessionStart -> lavish-axi.
  - Goal-session initializer tests pass.
  - Existing workflow canonical-layout validation passes.
provenance:
  source: https://github.com/backnotprop/plannotator
  installer: https://plannotator.ai/install.sh
  signed_provenance: not_verified
  reason: local gh authentication token is invalid
rollback:
  - Restore the previous hooks.json from the recorded pre-change copy if needed.
  - Revert only the listed documentation/template changes after confirming consumers.
  - Do not delete existing .lavish artifacts automatically.
