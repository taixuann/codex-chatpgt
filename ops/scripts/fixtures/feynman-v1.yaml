kind: feynman.policy-fixtures.v1
cases:
  - id: supported-evidence
    evidence:
      - category: observation
        supports: [c1]
      - category: sourced_claim
        supports: [c1]
    claim: {type: descriptive}
    expected: {status: SUPPORTED, route: NONE}
  - id: insufficient-evidence
    claim: {type: descriptive}
    expected: {status: INSUFFICIENT_EVIDENCE, route: NONE}
  - id: conflicting-evidence
    evidence:
      - category: observation
        supports: [c1]
        conflicts: true
    claim: {type: descriptive}
    expected: {status: CONFLICTING_EVIDENCE, route: ATHENA}
  - id: contradictory-new-evidence
    evidence:
      - category: sourced_claim
        supports: [c1]
    contradictory_new_evidence: true
    claim: {type: descriptive}
    expected: {status: CONFLICTING_EVIDENCE, route: ATHENA}
  - id: unsupported-mechanistic-overclaim
    evidence:
      - category: observation
        supports: [mechanism]
    claim: {type: mechanistic}
    expected: {status: INSUFFICIENT_EVIDENCE, route: HUMAN}
  - id: high-r2-non-identifiable
    fit_r2: 0.999
    candidate_mechanisms: [a, b]
    evidence:
      - category: observation
        supports: [c1]
    claim: {type: mechanistic}
    expected: {status: REQUIRES_ADDITIONAL_MEASUREMENT, route: HUMAN}
  - id: wrong-uncertainty-level
    aggregation_mismatch: true
    evidence:
      - category: observation
        supports: [c1]
    claim: {type: descriptive}
    expected: {status: INSUFFICIENT_EVIDENCE, route: HUMAN}
  - id: stale-method-result-reference
    stale_reference: true
    evidence:
      - category: sourced_claim
        supports: [c1]
    claim: {type: descriptive}
    expected: {status: INSUFFICIENT_EVIDENCE, route: PROMETHEUS}
  - id: topical-source-not-supporting
    source_support: false
    evidence:
      - category: sourced_claim
        supports: []
    claim: {type: descriptive}
    expected: {status: INSUFFICIENT_EVIDENCE, route: HUMAN}
  - id: context-gap-routing
    failure: context_gap
    expected: {status: INSUFFICIENT_EVIDENCE, route: ARGUS}
  - id: implementation-gap-routing
    failure: implementation_gap
    expected: {status: INSUFFICIENT_EVIDENCE, route: PROMETHEUS}
  - id: control-plane-gap-routing
    failure: control_plane_gap
    expected: {status: INSUFFICIENT_EVIDENCE, route: FRANKY}
  - id: consequential-review-routing
    failure: consequential_ambiguity
    expected: {status: INSUFFICIENT_EVIDENCE, route: ATHENA}
