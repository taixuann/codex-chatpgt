registry: manifests/archive/2026-09-01/agent-contracts.yaml
artifacts:
  - artifact_id: artifact-accepted
    lifecycle_state: ACCEPTED
    owner: parent
    producer: prometheus
    reviewer: athena
    previous_state: REVIEWED
    authority_status: accepted
    evidence_ids: [evidence-1]
    claim_ids: [claim-1]
    review_ids: [review-1]
    decision_id: decision-1
    state_target: canonical-state
  - artifact_id: artifact-draft
    lifecycle_state: DRAFT
    owner: parent
    producer: argus
    reviewer: null
    authority_status: proposed
    evidence_ids: []
    claim_ids: []
    review_ids: []
evidence:
  - id: evidence-1
    source: deterministic-test
    provenance: test-fixture
claims:
  - id: claim-1
    evidence_ids: [evidence-1]
reviews:
  - id: review-1
    reviewer: athena
    claim_ids: [claim-1]
    outcome: PASS
decisions:
  - id: decision-1
    review_ids: [review-1]
    claim_ids: [claim-1]
    outcome: ACCEPT
promotions:
  - artifact_id: artifact-accepted
    decision_id: decision-1
    target: canonical-state
    status: ALLOWED
cases:
  - id: unsupported-inference
    kind: claim
    evidence_ids: []
    expect: FAIL
  - id: missing-provenance
    kind: evidence
    provenance: null
    expect: FAIL
  - id: invalid-handoff
    kind: handoff
    from_agent: argus
    to_agent: argus
    expect: FAIL
  - id: missing-evidence
    kind: claim
    evidence_ids: []
    expect: FAIL
  - id: unauthorized-mutation
    kind: mutation
    agent: argus
    target: global-skills
    expect: FAIL
  - id: wrong-capability
    kind: capability
    agent: argus
    capability: implementation-quality-gate
    expect: FAIL
  - id: incomplete-closeout
    kind: closeout
    status: INCOMPLETE
    expect: FAIL
