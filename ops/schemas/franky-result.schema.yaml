$schema: https://json-schema.org/draft/2020-12/schema
title: Franky bounded result contract
type: object
additionalProperties: false
required:
  - kind
  - version
  - contract_version
  - request_id
  - status
  - lifecycle
  - evidence_freshness
  - routing
  - changes
  - closure
  - validation
  - review
  - unresolved
  - evolution
  - runtime_evidence
properties:
  kind: {const: franky.result.v1}
  version: {const: 1}
  contract_version:
    type: object
    additionalProperties: false
    required: [major, minor]
    properties:
      major: {type: integer, minimum: 1}
      minor: {type: integer, minimum: 0}
  request_id: {type: string, minLength: 1}
  status: {enum: [acceptance_ready, blocked, escalated, failed]}
  lifecycle:
    type: object
    additionalProperties: false
    required: [state, evidence]
    properties:
      state:
        enum: [REQUEST, CONTRACT, ADMISSION, ROUTING, IMPACT, EXECUTION, VALIDATION, CLOSURE, ACCEPTANCE_READY]
      evidence:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [state, status, source, provenance]
          properties:
            state:
              enum: [REQUEST, CONTRACT, ADMISSION, ROUTING, IMPACT, EXECUTION, VALIDATION, CLOSURE, ACCEPTANCE_READY]
            status: {enum: [PASS, BLOCKED, NOT_ASSESSED, NOT_APPLICABLE]}
            source: {type: string, minLength: 1}
            detail: {type: string}
            provenance:
              type: object
              additionalProperties: false
              required: [source_state, commit, observed_at, result]
              properties:
                source_state: {type: string, minLength: 1}
                commit: {type: string, minLength: 1}
                observed_at: {type: string, minLength: 1}
                result: {enum: [PASS, BLOCKED, NOT_ASSESSED, NOT_APPLICABLE]}
  evidence_freshness:
    type: object
    additionalProperties: false
    required: [source_commit, validated_at, mutation_free_since_validation, invalidated_by_mutation]
    properties:
      source_commit: {type: string, minLength: 1}
      validated_at: {type: string, minLength: 1}
      mutation_free_since_validation: {type: boolean}
      invalidated_by_mutation: {type: boolean}
  routing:
    type: object
    additionalProperties: false
    required: [operation_class, primary_capability, primary_reason, supporting_capabilities, supporting_reasons]
    properties:
      operation_class: {type: string, minLength: 1}
      primary_capability: {type: string, minLength: 1}
      primary_reason: {type: string, minLength: 1}
      supporting_capabilities: {type: array, items: {type: string}}
      supporting_reasons:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [capability, reason]
          properties:
            capability: {type: string, minLength: 1}
            reason: {type: string, minLength: 1}
      lifecycle_capability: {type: string, minLength: 1}
      lifecycle_reason: {type: string, minLength: 1}
      impact_required: {type: boolean}
      impact_evidence:
        type: object
        additionalProperties: false
        required: [source_state, surfaces, supporting_capabilities]
        properties:
          source_state: {type: string, minLength: 1}
          surfaces: {type: array, items: {type: string}, minItems: 1}
          supporting_capabilities: {type: array, items: {type: string}, minItems: 1}
  changes:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [path, action]
      properties:
        path: {type: string, minLength: 1}
        action: {enum: [created, modified, deleted, unchanged_valid, not_applicable, blocked, not_assessed]}
  closure:
    type: object
    additionalProperties: false
    required: [implementation, canonical_state, references, proof]
    properties:
      implementation: {enum: [PASS, BLOCKED, NOT_ASSESSED, NOT_APPLICABLE]}
      canonical_state: {enum: [PASS, BLOCKED, NOT_ASSESSED, NOT_APPLICABLE]}
      references: {enum: [PASS, BLOCKED, NOT_ASSESSED, NOT_APPLICABLE]}
      proof: {enum: [PASS, BLOCKED, NOT_ASSESSED, NOT_APPLICABLE]}
  validation:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [check, status, source_state]
      properties:
        check: {type: string, minLength: 1}
        status: {enum: [PASS, FAIL, BLOCKED, NOT_ASSESSED]}
        source_state: {type: string, minLength: 1}
  review:
    type: object
    additionalProperties: false
    required: [required, status, scope, not_reviewed, reviewer_id, reviewer_role, review_session_id, review_record]
    properties:
      required: {type: boolean}
      status: {enum: [PASS, NOT_ASSESSED, BLOCKED, NOT_APPLICABLE]}
      reviewer: {type: string}
      reviewer_id: {type: string, minLength: 1}
      reviewer_role: {enum: [independent_reviewer, parent_acceptance]}
      review_session_id: {type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'}
      review_record: {type: string, minLength: 1}
      scope: {type: array, items: {type: string}, minItems: 1}
      not_reviewed: {type: array, items: {type: string}}
  unresolved:
    type: object
    additionalProperties: false
    required: [blockers, limitations]
    properties:
      blockers: {type: array, items: {type: string}}
      limitations: {type: array, items: {type: string}}
  evolution:
    type: object
    additionalProperties: false
    required: [status, observation, candidate_improvements, promotion_required]
    properties:
      status: {enum: [NO_ACTION, PROPOSED, BLOCKED]}
      observation: {type: string, minLength: 1}
      candidate_improvements: {type: array, items: {type: string}}
      promotion_required: {type: boolean}
  runtime_evidence:
    type: object
    additionalProperties: false
    required: [configuration, dispatch, skill_loading, mutation]
    properties:
      configuration:
        $ref: '#/$defs/runtimeEvidence'
      dispatch:
        $ref: '#/$defs/runtimeEvidence'
      skill_loading:
        $ref: '#/$defs/runtimeEvidence'
      mutation:
        $ref: '#/$defs/runtimeEvidence'
$defs:
  runtimeEvidence:
    type: object
    additionalProperties: false
    required: [status, evidence]
    properties:
      status: {enum: [PASS, BLOCKED, NOT_ASSESSED]}
      evidence: {type: string, minLength: 1}
