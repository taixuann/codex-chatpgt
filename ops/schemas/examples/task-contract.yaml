id: TASK-CONTROL-PLANE-VALIDATION-20260809-001
objective: Validate the canonical control-plane contract surface.
scope:
  include:
    - ops/schemas/task-contract.schema.yaml
    - ops/scripts/validate_task_contract.py
    - .github/workflows/franky-validate.yml
  exclude:
    - credentials
    - sessions
    - logs
    - caches
    - linked research projects
context:
  canonical:
    - AGENTS.md
    - documentation/CURRENT.md
    - documentation/DECISIONS.md
    - ops/schemas/task-contract.schema.yaml
  supporting:
    - .github/workflows/franky-validate.yml
required_capabilities:
  - schema validation
  - deterministic failure reporting
expected_output:
  - validation result
  - exact failing field when invalid
validation:
  - valid fixture exits successfully
  - malformed fixture reports a non-zero result
stop_conditions:
  - schema and validator are incompatible
  - validation would require project or credential state
review:
  required: true
  reason: The validator is a deterministic control-plane safety check.
