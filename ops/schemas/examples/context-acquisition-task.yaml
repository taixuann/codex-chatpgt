id: TASK-CONTEXT-ACQUISITION-20260809-001
objective: Acquire the minimum canonical and repository evidence needed to resume planning.
scope:
  include:
    - AGENTS.md
    - documentation/CURRENT.md
    - documentation/DECISIONS.md
    - documentation/OPERATING-WORKFLOW.md
  exclude:
    - credentials
    - sessions
    - logs
    - caches
    - linked research projects
context:
  canonical:
    - AGENTS.md
    - documentation/CURRENT.md
    - documentation/DECISIONS.md
  supporting:
    - documentation/OPERATING-WORKFLOW.md
required_capabilities:
  - bounded read-only context acquisition
  - compact evidence packet generation
expected_output:
  - canonical file hashes
  - repository evidence hashes
  - conflicts and uncertainties
validation:
  - explicit allowlist only
  - no writes to the selected root
  - deterministic ordering and hashes
stop_conditions:
  - path is outside the selected root
  - path is sensitive, missing, a symlink, or not UTF-8 text
review:
  required: false
  reason: The parent retains planning authority; review is selected only if the downstream task is consequential.
