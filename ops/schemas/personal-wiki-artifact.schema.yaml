schema_version: 1
kind: personal-wiki.artifact.v1
description: >-
  Provenance-bearing reusable personal scientific context and optional
  promotion proposal. This schema does not grant write authority.
required:
  - kind
  - id
  - title
  - artifact_state
  - owner
  - producer
  - authority_status
  - provenance
  - claims
  - context_consumption
  - promotion
properties:
  kind: {type: string, enum: [personal-wiki.artifact.v1]}
  id: {type: string, minLength: 1}
  title: {type: string, minLength: 1}
  artifact_state: {type: string, enum: [DRAFT, REVIEWED, SUPERSEDED, ARCHIVED]}
  owner: {type: string, enum: [personal_wiki_owner]}
  producer: {type: string, enum: [human, feynman, parent]}
  authority_status: {type: string, enum: [PERSONAL_CONTEXT_ONLY]}
  provenance:
    type: object
    required: [source_refs, captured_at, source_state]
    properties:
      source_refs: {type: array, minItems: 1}
      captured_at: {type: string, minLength: 1}
      source_state: {type: string, minLength: 1}
      source_commit: {type: string}
  claims:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, category, statement, evidence_refs]
      properties:
        id: {type: string, minLength: 1}
        category: {type: string, enum: [personal_understanding, hypothesis, uncertainty, unsupported_or_unknown]}
        statement: {type: string, minLength: 1}
        evidence_refs: {type: array}
  context_consumption:
    type: object
    required: [authorized_consumers, authorization_ref, use, project_authority_overrides]
    properties:
      authorized_consumers: {type: array, minItems: 1, items: {type: string, minLength: 1}}
      authorization_ref: {type: string, minLength: 1}
      use: {type: string, enum: [reusable_context]}
      project_authority_overrides: {type: boolean, const: true}
  promotion:
    type: object
    required: [status, target, write_performed]
    properties:
      status: {type: string, enum: [NONE, PROPOSED, REJECTED, ACCEPTED]}
      target: {type: string, minLength: 1}
      rationale: {type: string}
      proposal_id: {type: string}
      authorization_ref: {type: string}
      owner_decision_ref: {type: string}
      write_performed: {type: boolean, const: false}
