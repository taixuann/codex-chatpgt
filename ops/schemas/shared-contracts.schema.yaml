schema_version: 1
kind: codex.shared-contracts.v1
description: Shared evidence-bearing envelopes; lifecycle execution remains owned by existing workflows.
contract_kinds: [request.v1, context.v1, handoff.v1, result.v1, review.v1, run.v1]
required:
  - kind
  - id
  - agent
  - provenance
  - evidence
  - claims
  - unknowns
  - conflicts
  - readiness
  - validation_status
properties:
  kind: {type: string, enum: [request.v1, context.v1, handoff.v1, result.v1, review.v1, run.v1]}
  id: {type: string, minLength: 1}
  agent: {type: string, enum: [argus, prometheus, athena, franky, parent]}
  provenance:
    type: object
    required: [source, source_state, captured_at]
    properties:
      source: {type: string, minLength: 1}
      source_state: {type: string, minLength: 1}
      captured_at: {type: string, minLength: 1}
      source_commit: {type: string}
  evidence: {type: array}
  claims: {type: array}
  unknowns: {type: array}
  conflicts: {type: array}
  readiness: {type: string, enum: [NOT_READY, READY_WITH_BLOCKERS, READY, ACCEPTANCE_READY]}
  validation_status: {type: string, enum: [NOT_ASSESSED, PASS, FAIL, BLOCKED]}
  payload: {type: object}
