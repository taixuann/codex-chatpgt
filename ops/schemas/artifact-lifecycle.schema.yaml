schema_version: 1
kind: codex.artifact-lifecycle.v1
states: [DRAFT, VALIDATED, REVIEWED, ACCEPTED, SUPERSEDED, ARCHIVED, INVALIDATED]
required: [artifact_id, lifecycle_state, owner, producer, reviewer, authority_status, evidence_ids, claim_ids, review_ids]
authority_statuses: [proposed, process_validated, reviewed, accepted, superseded, archived, invalidated]
transition_rules:
  DRAFT: [VALIDATED, INVALIDATED]
  VALIDATED: [REVIEWED, INVALIDATED]
  REVIEWED: [ACCEPTED, INVALIDATED]
  ACCEPTED: [SUPERSEDED, ARCHIVED, INVALIDATED]
  SUPERSEDED: [ARCHIVED]
  ARCHIVED: []
  INVALIDATED: []
