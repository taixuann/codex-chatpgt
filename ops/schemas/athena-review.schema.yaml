$schema: https://json-schema.org/draft/2020-12/schema
title: Athena formal review request
type: object
additionalProperties: false
required: [kind, target, review_class, criteria, scope, evidence, context, authority, output]
properties:
  kind: {const: athena.review.v1}
  target:
    type: object
    additionalProperties: false
    required: [ref, revision]
    properties:
      ref: {type: string, minLength: 1}
      revision: {type: string, minLength: 1}
  review_class: {enum: [implementation, architecture_contract, readiness, scientific_evidence, risk_security]}
  criteria:
    type: object
    additionalProperties: false
    required: [source, locked]
    properties:
      source: {type: array, minItems: 1, items: {type: string, minLength: 1}}
      locked: {const: true}
  scope:
    type: object
    additionalProperties: false
    required: [include, exclude]
    properties:
      include: {type: array, items: {type: string}}
      exclude: {type: array, items: {type: string}}
  evidence: {type: array}
  context:
    type: object
    additionalProperties: false
    required: [optional_refs]
    properties:
      optional_refs: {type: array, items: {type: string}}
  authority:
    type: object
    additionalProperties: false
    required: [mutation, final_acceptance]
    properties:
      mutation: {const: denied}
      final_acceptance: {const: denied}
  output:
    type: object
    additionalProperties: false
    required: [require]
    properties:
      require: {type: array, minItems: 5, items: {type: string}}
