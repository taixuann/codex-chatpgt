$schema: https://json-schema.org/draft/2020-12/schema
title: Franky bounded task contract
type: object
additionalProperties: false
required:
  - kind
  - version
  - request_id
  - objective
  - scope
  - intent
  - authority
  - required_capabilities
  - constraints
  - done_criteria
  - required_outcomes
  - acceptance_requirements
  - stop_conditions
properties:
  kind: {const: franky.task.v1}
  version: {const: 1}
  request_id: {type: string, minLength: 1}
  objective: {type: string, minLength: 1}
  scope:
    type: object
    additionalProperties: false
    required: [repository, primary_targets, excluded_targets]
    properties:
      repository: {type: string, minLength: 1}
      primary_targets: {type: array, items: {type: string}, minItems: 1}
      excluded_targets: {type: array, items: {type: string}}
  intent:
    type: object
    additionalProperties: false
    required: [mode, completion]
    properties:
      mode: {enum: [observe, audit, mutate, handoff]}
      completion: {enum: [bounded, end_to_end]}
  authority:
    type: object
    additionalProperties: false
    required: [mutation, external_effects, architecture_change]
    properties:
      mutation: {enum: [allowed, denied, approval_required]}
      external_effects: {enum: [allowed, denied, approval_required]}
      architecture_change: {enum: [allowed, proposal_only, denied]}
  required_capabilities: {type: array, items: {type: string}, minItems: 1}
  constraints: {type: array, items: {type: string}, minItems: 1}
  done_criteria: {type: array, items: {type: string}, minItems: 1}
  required_outcomes: {type: array, items: {type: string}, minItems: 1}
  acceptance_requirements: {type: array, items: {type: string}, minItems: 1}
  stop_conditions: {type: array, items: {type: string}, minItems: 1}
  review:
    type: object
    additionalProperties: false
    required: [required, reason]
    properties:
      required: {type: boolean}
      reason: {type: string, minLength: 1}
