schema_version: 2
skill: skill-creator
purpose: Bound routing and lifecycle evaluation with must-pass, regression, and held-out evidence.
gates:
  - {id: G0_NECESSITY, evidence: native/AGENTS/script/existing-skill comparison and justified disposition}
  - {id: G1_STRUCTURE, evidence: frontmatter/resources/placeholders/portability}
  - {id: G2_PROVENANCE, evidence: source/ref/path/license/adaptation-diff}
  - {id: G3_ROUTING, evidence: TP/FN/FP/TN and precision/recall}
  - {id: G4_BEHAVIOR, evidence: observable process and disposition}
  - {id: G5_COEXISTENCE, evidence: sibling/capability/placement checks}
  - {id: G6_EFFICIENCY, evidence: paired necessity and cost measurements}
  - {id: G7_INDEPENDENT_REVIEW, evidence: fresh exact-revision review}
cases:
  - {id: route-explicit-positive, kind: routing, polarity: positive, partition: must_pass, gate: G3_ROUTING, expected: skill-creator, prompt: "Create a Codex skill for a repeated document transformation with provenance and validation."}
  - {id: route-implicit-positive, kind: routing, polarity: positive, partition: must_pass, gate: G3_ROUTING, expected: skill-creator, prompt: "This procedure keeps recurring across repositories; should it become a skill, and where should it live?"}
  - {id: route-contextual-positive, kind: routing, polarity: positive, partition: must_pass, gate: G3_ROUTING, expected: skill-creator, prompt: "While reviewing a project setup, compare the existing skills and decide whether a small local skill is justified."}
  - {id: route-ambiguous-positive, kind: routing, polarity: positive, partition: held_out, gate: G3_ROUTING, expected: skill-creator, prompt: "We keep repeating the same evidence-backed workflow. First determine whether guidance, a script, or a reusable skill is the right owner."}
  - {id: route-noisy-positive, kind: routing, polarity: positive, partition: held_out, gate: G3_ROUTING, expected: skill-creator, prompt: "The team has copied this multi-step workflow into four repositories and it now drifts; please compare references and decide whether a maintained Codex skill is warranted, preserving provenance and validation."}
  - {id: route-explicit-negative, kind: routing, polarity: negative, partition: must_pass, gate: G3_ROUTING, expected: none, prompt: "Use $pdf to rotate this PDF; do not create or modify a skill."}
  - {id: route-adjacent-negative, kind: routing, polarity: negative, partition: must_pass, gate: G3_ROUTING, expected: none, prompt: "Fix the failing parser implementation and add a unit test."}
  - {id: route-sibling-negative, kind: routing, polarity: negative, partition: must_pass, gate: G3_ROUTING, expected: none, prompt: "Use the existing PDF skill to rotate this PDF; do not create or modify a skill."}
  - {id: route-agents-negative, kind: routing, polarity: negative, partition: held_out, gate: G3_ROUTING, expected: none, prompt: "Add one repository-wide invariant to AGENTS.md; this is policy maintenance, not a new skill."}
  - {id: route-script-negative, kind: routing, polarity: negative, partition: held_out, gate: G3_ROUTING, expected: none, prompt: "Write one short shell command for this one-off cleanup and do not package it as a reusable capability."}
  - {id: route-native-negative, kind: routing, polarity: negative, partition: held_out, gate: G3_ROUTING, expected: none, prompt: "Use the platform's native date input; no reusable skill or procedure is needed."}
  - {id: route-noisy-negative, kind: routing, polarity: negative, partition: held_out, gate: G3_ROUTING, expected: none, prompt: "The build is red after a dependency update. Diagnose the code, patch the implementation, and run tests; avoid changing skills or repository guidance."}
  - {id: create-local-upstream, kind: CREATE, partition: must_pass, gate: G0_NECESSITY, gates: [G0_NECESSITY, G4_BEHAVIOR], expected: CLONE_AND_ADAPT, trace_markers: [necessity, provenance, clone, validation], artifact: created, artifact_path: .agents/skills/generated-skill/SKILL.md, prompt: "First compare native behavior, AGENTS guidance, scripts, existing skills, and maintained upstream candidates. Only if a reusable capability is justified, adapt a maintained upstream baseline into .agents/skills/generated-skill/SKILL.md and preserve provenance."}
  - {id: create-multimode-one-skill, kind: CREATE, partition: must_pass, gate: G0_NECESSITY, gates: [G0_NECESSITY, G4_BEHAVIOR], expected: CLONE_AND_ADAPT, trace_markers: [necessity, provenance, modes, validation], artifact: created, artifact_path: .agents/skills/generated-multimode/SKILL.md, prompt: "First decide whether one progressively disclosed skill is necessary and whether an existing/local/upstream capability can be reused. If justified, support create, update, maintain, and evaluate behavior without subskills at .agents/skills/generated-multimode/SKILL.md."}
  - {id: create-no-skill, kind: CREATE, partition: regression, gate: G0_NECESSITY, expected: REJECT, trace_markers: [necessity, reject], prompt: "The task needs one shell command only; compare native behavior, scripts, and existing guidance, then reject unnecessary skill creation."}
  - {id: update-bounded, kind: UPDATE, partition: must_pass, gate: G0_NECESSITY, gates: [G0_NECESSITY, G4_BEHAVIOR], expected: UPDATE_EXISTING, trace_markers: [necessity, before, provenance], artifact: modified, artifact_path: .agents/skills/existing-skill/SKILL.md, prompt: "First decide whether this bounded change is necessary and whether existing guidance already suffices. If justified, tighten .agents/skills/existing-skill/SKILL.md while preserving its name and provenance. Record the before state first."}
  - {id: update-substantive, kind: UPDATE, partition: regression, gate: G0_NECESSITY, gates: [G0_NECESSITY, G4_BEHAVIOR, G6_EFFICIENCY], paired: true, expected: UPDATE_EXISTING, trace_markers: [necessity, baseline, regression, held-out], artifact: modified, artifact_path: .agents/skills/existing-skill/SKILL.md, prompt: "First establish the target failure and why an update is necessary rather than deletion or reuse. Then change .agents/skills/existing-skill/SKILL.md materially and rerun baseline, candidate, regression, and held-out evidence."}
  - {id: maintain-upstream-drift, kind: MAINTAIN, partition: regression, gate: G0_NECESSITY, gates: [G0_NECESSITY, G2_PROVENANCE], expected: CLONE_AND_ADAPT, trace_markers: [necessity, drift, provenance], artifact: modified, artifact_path: .agents/skills/existing-skill/references/provenance.md, prompt: "First decide whether maintenance is necessary or whether the skill should remain unchanged/retire. If justified, compare upstream drift before updating .agents/skills/existing-skill/references/provenance.md."}
  - {id: maintain-overlap, kind: MAINTAIN, partition: held_out, gate: G0_NECESSITY, gates: [G0_NECESSITY, G5_COEXISTENCE, G6_EFFICIENCY], paired: true, expected: MERGE, trace_markers: [necessity, collision, merge, pdf], prompt: "First decide whether a maintenance change is necessary. For two active skills with overlapping triggers, choose a single owner and record the merge disposition."}
  - {id: maintain-localize, kind: MAINTAIN, partition: held_out, gate: G0_NECESSITY, gates: [G0_NECESSITY, G5_COEXISTENCE], expected: LOCALIZE, trace_markers: [necessity, placement, localize, domain-workflow], prompt: "First decide whether global maintenance is necessary. For a domain-specific global skill used by one repository, move it local-first and record the placement decision."}
  - {id: maintain-retire, kind: MAINTAIN, partition: regression, gate: G0_NECESSITY, gates: [G0_NECESSITY, G5_COEXISTENCE], expected: RETIRE, trace_markers: [necessity, usage, retire], prompt: "First decide whether the stale global skill still earns active status. If not, remove it from active discovery and record the retirement."}
  - {id: evaluate-good, kind: EVALUATE, partition: must_pass, gate: G1_STRUCTURE, gates: [G1_STRUCTURE, G6_EFFICIENCY], paired: true, expected: PASS, trace_markers: [structure, routing, provenance, review], prompt: "Evaluate the fixture skill with valid structure, bounded routing, provenance, and complete process evidence; write the evaluation report in the fixture."}
  - {id: evaluate-broad-description, kind: EVALUATE, partition: regression, gate: G3_ROUTING, expected: REJECT, trace_markers: [routing, reject], prompt: "Evaluate the fixture skill whose description attracts every coding request and write the rejection evidence in the fixture."}
  - {id: evaluate-sibling-collision, kind: EVALUATE, partition: held_out, gate: G5_COEXISTENCE, expected: REJECT, trace_markers: [collision, reject, pdf], prompt: "Evaluate the isolated skill that steals a sibling's trigger in the active catalog and write the rejection evidence in the fixture."}
  - {id: evaluate-decorative-resources, kind: EVALUATE, partition: regression, gate: G1_STRUCTURE, expected: SIMPLIFY, trace_markers: [resource, simplify], prompt: "Evaluate the fixture skill containing unused scripts and decorative references and write the simplification evidence in the fixture."}
  - {id: evaluate-skipped-process, kind: EVALUATE, partition: held_out, gate: G2_PROVENANCE, expected: REJECT, trace_markers: [provenance, reject], prompt: "The output looks correct, but the required provenance search was skipped; write the rejection evidence in the fixture."}
