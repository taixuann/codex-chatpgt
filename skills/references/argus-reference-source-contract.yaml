schema_version: 1
kind: argus.reference_source_map.v1
purpose: Pre-discovery declaration of searchable sources and evidence qualification.
required: [intent, bounded_path_source_service, scope, authority, priority, load_strategy, freshness, validated]
optional_relationships: [dependencies, supersession]
field_rules:
  intent: question and consumer
  bounded_path_source_service: at least one path, source, or service
  scope: explicit include and exclude boundaries
  authority: ordered authority sources and conflict rule
  priority: ordered retrieval priorities
  load_strategy: minimum-first, controlled-expansion, or saturation-stop
  freshness: threshold and observation time
  validated: provenance/anchor validation state
