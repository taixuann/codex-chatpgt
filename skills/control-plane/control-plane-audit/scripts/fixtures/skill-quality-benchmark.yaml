  - {id: bootstrap-direct-validation, kind: positive, style: direct, expected: project-bootstrap, prompt: Validate the proposed project artifact map before materializing it.}
  - {id: bootstrap-oblique-boundary, kind: positive, style: oblique, expected: project-bootstrap, prompt: Set up analysis folders without copying or rewriting the source dataset.}
  - {id: bootstrap-context-reversible, kind: positive, style: contextual, expected: project-bootstrap, prompt: Bootstrap the project with an explicit dry-run and a reversible apply step.}
  - {id: bootstrap-none-science, kind: none, style: none, expected: none, prompt: Explain the likely conduction mechanism from this I-V curve.}

  - {id: adapter-direct, kind: positive, style: direct, expected: runtime-adapter-management, prompt: Validate and install the approved Codex runtime adapter with scope and collision checks.}
  - {id: adapter-oblique, kind: positive, style: oblique, expected: runtime-adapter-management, prompt: Check whether this agent profile is safe to add without changing canonical roles or routing.}
  - {id: adapter-context, kind: positive, style: contextual, expected: runtime-adapter-management, prompt: A new runtime adapter was approved; validate its schema, dependencies, and sandbox boundaries before installation.}
  - {id: adapter-neighbor, kind: neighbor, style: neighbor, expected: runtime-adapter-management, neighbors: [external-handoff], prompt: Prepare an adapter for another executor and verify the installation contract.}
  - {id: adapter-ambiguous, kind: ambiguous, style: contextual, expected: none, neighbors: [runtime-adapter-management, external-handoff], prompt: Add support for this other agent.}
  - {id: adapter-negative-audit, kind: negative, style: adjacent, expected: none, neighbors: [runtime-adapter-management, control-plane-audit], prompt: Audit the current control-plane state and report findings.}
  - {id: adapter-negative-code, kind: negative, style: adjacent, expected: none, neighbors: [runtime-adapter-management], prompt: Fix the failing Python unit test.}
