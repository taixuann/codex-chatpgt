  - {id: adapter-direct-dependency, kind: positive, style: direct, expected: runtime-adapter-management, prompt: Check that the approved runtime adapter dependencies are available and bounded.}
  - {id: adapter-oblique-owner, kind: positive, style: oblique, expected: runtime-adapter-management, prompt: Preserve the canonical role owner while adding this runtime-specific adapter.}
  - {id: adapter-context-rollback, kind: positive, style: contextual, expected: runtime-adapter-management, prompt: Prepare the adapter installation audit with collision and rollback evidence.}
  - {id: adapter-none-science, kind: none, style: none, expected: none, prompt: Summarize the results of this spectroscopy experiment.}

  - {id: closeout-direct, kind: positive, style: direct, expected: shared-session-closeout, prompt: Close the governed session using acceptance evidence and record unresolved items.}
  - {id: closeout-oblique, kind: positive, style: oblique, expected: shared-session-closeout, prompt: The work is finished; determine what durable outcome, provenance, and open risks must be recorded.}
  - {id: closeout-context, kind: positive, style: contextual, expected: shared-session-closeout, prompt: A governed task reached its acceptance gate; prepare the correct durable closeout state.}
  - {id: closeout-neighbor, kind: neighbor, style: neighbor, expected: shared-session-closeout, neighbors: [external-handoff], prompt: Record the result after an external executor returned its handoff evidence.}
  - {id: closeout-ambiguous, kind: ambiguous, style: contextual, expected: none, neighbors: [shared-session-closeout, external-handoff], prompt: "We are done here; what next?"}
  - {id: closeout-negative-audit, kind: negative, style: adjacent, expected: none, neighbors: [shared-session-closeout, control-plane-audit], prompt: Run a fresh control-plane audit and classify its findings.}
