version: 1
scope: canonical-six-co-loaded-skill-routing
active_skills:
  - control-plane-audit
  - external-handoff
  - instruction-maintenance
  - project-bootstrap
  - runtime-adapter-management
  - shared-session-closeout
cases:
  - {id: audit-direct, kind: positive, style: direct, expected: control-plane-audit, prompt: Audit the approved Codex control-plane change read-first and report exact affected paths.}
  - {id: audit-oblique, kind: positive, style: oblique, expected: control-plane-audit, prompt: Check whether the skills, agents, workflows, and schedules still agree after this maintenance change.}
  - {id: audit-context, kind: positive, style: contextual, expected: control-plane-audit, prompt: A governed health check is requested; validate deterministic contracts before interpreting runtime behavior.}
  - {id: audit-neighbor, kind: neighbor, style: neighbor, expected: control-plane-audit, neighbors: [external-handoff], prompt: Review a proposed control-plane update and identify validation evidence and unresolved references.}
  - {id: audit-ambiguous, kind: ambiguous, style: contextual, expected: none, neighbors: [control-plane-audit, instruction-maintenance], prompt: Please improve the way this repository is managed.}
  - {id: audit-negative-code, kind: negative, style: adjacent, expected: none, neighbors: [control-plane-audit], prompt: Fix the parser bug in the application and run its unit tests.}
  - {id: audit-negative-docs, kind: negative, style: adjacent, expected: none, neighbors: [control-plane-audit, instruction-maintenance], prompt: Rewrite this README paragraph for clarity.}
  - {id: audit-direct-validators, kind: positive, style: direct, expected: control-plane-audit, prompt: Run the selected control-plane validators and distinguish process pass from acceptance.}
  - {id: audit-oblique-governance, kind: positive, style: oblique, expected: control-plane-audit, prompt: Determine whether this maintenance request has an approval and rollback boundary.}
  - {id: audit-context-links, kind: positive, style: contextual, expected: control-plane-audit, prompt: Inspect the selected control-plane links and report stale or unresolved references.}
  - {id: audit-direct-schedule, kind: positive, style: direct, expected: control-plane-audit, prompt: Validate the approved scheduler definition and its bounded execution scope.}
  - {id: audit-oblique-impact, kind: positive, style: oblique, expected: control-plane-audit, prompt: Identify the producers and consumers affected by this control-plane contract change.}
  - {id: audit-context-rollback, kind: positive, style: contextual, expected: control-plane-audit, prompt: Review the proposed maintenance operation for rollback metadata before it is applied.}
  - {id: audit-none-science, kind: none, style: none, expected: none, prompt: Interpret the mechanism shown by these scientific measurements.}

  - {id: handoff-direct, kind: positive, style: direct, expected: external-handoff, prompt: Prepare a bounded handoff for an external executor without executing it.}
  - {id: handoff-oblique, kind: positive, style: oblique, expected: external-handoff, prompt: Package this approved work for a separate runtime with scope, acceptance, and rollback.}
  - {id: handoff-context, kind: positive, style: contextual, expected: external-handoff, prompt: The task crosses a runtime boundary; write the executor packet and leave the human gate explicit.}
  - {id: handoff-neighbor, kind: neighbor, style: neighbor, expected: external-handoff, neighbors: [shared-session-closeout], prompt: Transfer this bounded implementation to another executor and state what evidence it must return.}
  - {id: handoff-ambiguous, kind: ambiguous, style: contextual, expected: none, neighbors: [external-handoff, shared-session-closeout], prompt: "Can someone else take care of this?"}
  - {id: handoff-negative-audit, kind: negative, style: adjacent, expected: none, neighbors: [external-handoff, control-plane-audit], prompt: Audit the local skill catalog and report structural findings.}
  - {id: handoff-negative-bootstrap, kind: negative, style: adjacent, expected: none, neighbors: [external-handoff, project-bootstrap], prompt: Create a new file-first project layout locally.}
  - {id: handoff-direct-approval, kind: positive, style: direct, expected: external-handoff, prompt: Draft the external execution packet with explicit approval and acceptance gates.}
  - {id: handoff-oblique-boundary, kind: positive, style: oblique, expected: external-handoff, prompt: Make this work portable to a different executor while preserving the local owner boundary.}
  - {id: handoff-context-acceptance, kind: positive, style: contextual, expected: external-handoff, prompt: State the exact evidence and acceptance conditions the receiving executor must return.}
  - {id: handoff-direct-rollback, kind: positive, style: direct, expected: external-handoff, prompt: Write the handoff rollback section for a bounded external execution.}
  - {id: handoff-oblique-scope, kind: positive, style: oblique, expected: external-handoff, prompt: Separate what the remote executor may do from what remains with the local operator.}
  - {id: handoff-context-provenance, kind: positive, style: contextual, expected: external-handoff, prompt: Preserve task provenance and unresolved questions while preparing the external packet.}
  - {id: handoff-none-science, kind: none, style: none, expected: none, prompt: Compare two materials-science explanations and cite their evidence.}

  - {id: instruction-direct, kind: positive, style: direct, expected: instruction-maintenance, prompt: Audit and update the nearest scoped AGENTS.md while preserving instruction precedence.}
  - {id: instruction-oblique, kind: positive, style: oblique, expected: instruction-maintenance, prompt: Find the local guidance file that governs this directory and remove the conflicting rule.}
  - {id: instruction-context, kind: positive, style: contextual, expected: instruction-maintenance, prompt: A repository behavior changed; maintain the scoped instructions without widening their authority.}
  - {id: instruction-neighbor, kind: neighbor, style: neighbor, expected: instruction-maintenance, neighbors: [project-bootstrap], prompt: Repair the local guidance contract for a project setup workflow.}
  - {id: instruction-ambiguous, kind: ambiguous, style: contextual, expected: none, neighbors: [instruction-maintenance, project-bootstrap], prompt: Make the project instructions better.}
  - {id: instruction-negative-handoff, kind: negative, style: adjacent, expected: none, neighbors: [instruction-maintenance, external-handoff], prompt: Prepare a packet for another runtime to execute.}
  - {id: instruction-negative-code, kind: negative, style: adjacent, expected: none, neighbors: [instruction-maintenance], prompt: Refactor this function without changing its behavior.}
  - {id: instruction-direct-locality, kind: positive, style: direct, expected: instruction-maintenance, prompt: Check instruction locality and precedence before changing the repository guidance.}
  - {id: instruction-oblique-boundary, kind: positive, style: oblique, expected: instruction-maintenance, prompt: Decide whether this rule belongs in the root or the nearest scoped guidance file.}
  - {id: instruction-context-precedence, kind: positive, style: contextual, expected: instruction-maintenance, prompt: Resolve a conflict between root guidance and the nearest directory instructions.}
  - {id: instruction-direct-audit, kind: positive, style: direct, expected: instruction-maintenance, prompt: Audit the scoped AGENTS.md files for precedence and locality violations.}
  - {id: instruction-oblique-scope, kind: positive, style: oblique, expected: instruction-maintenance, prompt: Keep this repository rule local so it cannot silently govern unrelated projects.}
  - {id: instruction-context-change, kind: positive, style: contextual, expected: instruction-maintenance, prompt: Update the instructions for this changed workflow and report what authority was preserved.}
  - {id: instruction-none-science, kind: none, style: none, expected: none, prompt: Plot the experimental data and describe the trend.}

  - {id: bootstrap-direct, kind: positive, style: direct, expected: project-bootstrap, prompt: Bootstrap a scientific file-first project with the smallest safe artifact map.}
  - {id: bootstrap-oblique, kind: positive, style: oblique, expected: project-bootstrap, prompt: Set up the new analysis workspace with metadata, raw-data boundaries, and validation gates.}
  - {id: bootstrap-context, kind: positive, style: contextual, expected: project-bootstrap, prompt: This is a greenfield scientific project; inspect first and create only the approved structure.}
  - {id: bootstrap-neighbor, kind: neighbor, style: neighbor, expected: project-bootstrap, neighbors: [instruction-maintenance], prompt: Establish a new project and make its local guidance inherit the repository policy.}
  - {id: bootstrap-ambiguous, kind: ambiguous, style: contextual, expected: none, neighbors: [project-bootstrap, instruction-maintenance], prompt: Please organize this project.}
  - {id: bootstrap-negative-audit, kind: negative, style: adjacent, expected: none, neighbors: [project-bootstrap, control-plane-audit], prompt: Validate an existing control-plane maintenance operation.}
  - {id: bootstrap-negative-edit, kind: negative, style: adjacent, expected: none, neighbors: [project-bootstrap], prompt: Add one field to this existing configuration file.}
  - {id: bootstrap-direct-dryrun, kind: positive, style: direct, expected: project-bootstrap, prompt: Run the file-first bootstrap in dry-run mode and report the proposed paths.}
  - {id: bootstrap-oblique-safety, kind: positive, style: oblique, expected: project-bootstrap, prompt: Create a reversible project skeleton while keeping raw inputs immutable.}
