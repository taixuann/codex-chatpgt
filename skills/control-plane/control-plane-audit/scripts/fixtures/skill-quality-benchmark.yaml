  - {id: closeout-oblique-gate, kind: positive, style: oblique, expected: shared-session-closeout, prompt: Do not declare completion until the required human gate and evidence are recorded.}
  - {id: closeout-context-provenance, kind: positive, style: contextual, expected: shared-session-closeout, prompt: Preserve the task provenance and unresolved risks in the session outcome.}
