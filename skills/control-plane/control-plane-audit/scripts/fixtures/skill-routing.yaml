    kind: neighbor
    prompt: Link this existing project into the Codex workspace without copying its contents.
    expected: none
    neighbors: [project-bootstrap]
  - id: workflow-validation-only
    kind: negative
    prompt: Validate this workflow YAML and report schema errors.
    expected: none
    neighbors: [control-plane-audit]
