    ]
  },
  "hard_gates": [
    {
      "id": "G01",
      "name": "SOURCE_FIDELITY",
      "definition": "Material facts are traceable to supplied/verified evidence and no unsupported fact is invented.",
      "applicable_modes": [
        "all"
      ],
      "failure_codes": [
        "fabricated_fact",
        "unsupported_specificity"
      ],
      "status_values": [
        "PASS",
        "FAIL",
        "UNRESOLVED"
      ],
      "applies_when": "material factual claims are present"
    },
    {
      "id": "G02",
      "name": "MEANING_PRESERVATION",
      "definition": "The requested revision preserves intended meaning and claim boundaries.",
      "applicable_modes": [
        "REVISE_PRESERVE_MEANING",
        "COMPARE_VARIANTS",
        "FIT_ADAPT"
      ],
      "failure_codes": [
        "meaning_mutation",
        "new_motivation"
      ],
      "status_values": [
        "PASS",
        "FAIL",
        "UNRESOLVED"
      ],
      "applies_when": "a source draft/locked meaning exists for preservation"
    },
    {
      "id": "G03",
      "name": "CLAIM_CALIBRATION",
      "definition": "Major empirical, causal, and evaluative claims do not exceed their evidence.",
      "applicable_modes": [
        "all"
      ],
      "failure_codes": [
        "mechanism_overclaim",
        "certainty_exceeds_evidence"
      ],
      "status_values": [
        "PASS",
        "FAIL",
        "UNRESOLVED"
      ],
      "applies_when": "material empirical/causal/evaluative claims are present"
    },
    {
      "id": "G04",
      "name": "CHRONOLOGY_OWNERSHIP",
      "definition": "Chronology, proposal/execution credit, collaboration, and applicant role remain accurate.",
      "applicable_modes": [
        "all"
      ],
      "failure_codes": [
        "hindsight_hypothesis",
        "retroactive_motivation",
        "ownership_inflation",
        "chronology_smoothing"
      ],
      "status_values": [
        "PASS",
        "FAIL",
        "UNRESOLVED"
      ],
      "applies_when": "chronology, collaboration, or ownership is material"
    },
    {
      "id": "G05",
      "name": "PROMPT_COMPLIANCE",
      "definition": "The target program prompt and format requirements are satisfied when known.",
      "applicable_modes": [
        "all"
      ],
      "failure_codes": [
        "prompt_requirement_missing",
        "format_violation"
      ],
      "status_values": [
        "PASS",
        "FAIL",
        "UNRESOLVED"
      ],
      "applies_when": "a target prompt/format requirement is supplied or target compliance is requested"
    },
    {
      "id": "G06",
      "name": "PROGRAM_AI_POLICY",
      "definition": "The requested writing operation is permitted by the most specific available application AI/authorship policy.",
      "applicable_modes": [
        "all"
      ],
      "failure_codes": [
        "policy_prohibits_operation",
        "policy_unresolved_material",
        "disclosure_requirement_ignored",
        "attestation_conflict"
      ],
      "status_values": [
        "PASS",
        "FAIL",
        "UNRESOLVED"
      ],
      "applies_when": "the requested operation concerns target application text governed by an AI/authorship policy"
    },
    {
      "id": "G07",
      "name": "PI_FACT_INTEGRITY",
      "definition": "Material PI/program facts used for fit are verified and current enough for the claim.",
      "applicable_modes": [
        "all"
      ],
      "failure_codes": [
        "unverified_pi_claim",
        "stale_fit_claim"
      ],
      "status_values": [
        "PASS",
        "FAIL",
        "UNRESOLVED"
      ],
      "applies_when": "material PI/program fit claims are present"
    },
    {
      "id": "G08",
      "name": "MATERIAL_CONSISTENCY",
      "definition": "No material contradiction remains across supplied SOP/CV/notes/application sources.",
      "applicable_modes": [
        "all"
      ],
      "failure_codes": [
        "cross_document_conflict"
      ],
      "status_values": [
        "PASS",
        "FAIL",
        "UNRESOLVED"
      ],
      "applies_when": "multiple supplied application/source artifacts overlap materially"
    },
    {
      "id": "G09",
      "name": "INTERNAL_CONSISTENCY",
      "definition": "The SOP does not materially contradict itself in facts, chronology, identity, or goals.",
      "applicable_modes": [
        "all"
      ],
      "failure_codes": [
        "internal_contradiction"
      ],
      "status_values": [
        "PASS",
        "FAIL",
        "UNRESOLVED"
      ],
      "applies_when": "a multi-sentence application artifact is being evaluated"
    },
    {
      "id": "G10",
      "name": "AUTHORSHIP_INTEGRITY_BOUNDARY",
      "definition": "The requested operation does not ask the skill to evade AI detectors/watermarks, fabricate human authorship signals, or deliberately degrade prose.",
      "applicable_modes": [
        "all"
      ],
      "failure_codes": [
        "detector_evasion_goal",
        "watermark_removal_goal",
        "deliberate_human_signal_injection"
      ],
      "status_values": [
        "PASS",
        "FAIL",
        "UNRESOLVED"
      ],
      "applies_when": "any requested operation could be used for detector/watermark evasion or deliberate authorship-signal manipulation"
    }
  ],
  "criteria": [
    {
      "id": "S01",
      "name": "Rhetorical function",
      "level": "sentence",
      "definition": "Whether the sentence performs a necessary identifiable job in its paragraph.",
      "applicable_modes": [
        "DRAFT_FROM_EVIDENCE",
        "REVISE_PRESERVE_MEANING",
        "DIAGNOSE_ONLY",
        "SCORE_ONLY",
        "COMPARE_VARIANTS",
        "FIT_ADAPT"
      ],
      "source_basis": [
        "repo_design",
        "gopen_swan"
      ],
      "not_assessed_when": [
        "paragraph_context_missing"
      ],
      "anchors": {
        "1": "No stable job, or the sentence attempts unrelated jobs.",
        "2": "Substantial rhetorical function weakness; some usable function/evidence remains.",
        "3": "The job is identifiable but partly redundant or misplaced.",
        "4": "Strong rhetorical function with a bounded weakness that has a clear repair.",
        "5": "The sentence performs one clear necessary job and supports the paragraph's primary purpose."
      }
    },
    {
      "id": "S02",
      "name": "Necessity",
      "level": "sentence",
      "definition": "Whether removing or merging the sentence would lose material meaning, evidence, or linkage.",
      "applicable_modes": [
        "DRAFT_FROM_EVIDENCE",
        "REVISE_PRESERVE_MEANING",
        "DIAGNOSE_ONLY",
        "SCORE_ONLY",
        "COMPARE_VARIANTS",
        "FIT_ADAPT"
      ],
      "source_basis": [
        "repo_design"
      ],
      "not_assessed_when": [
        "paragraph_context_missing"
      ],
      "anchors": {
        "1": "Removal loses nothing material; sentence is decorative/inventory-like.",
        "2": "Substantial necessity weakness; some usable function/evidence remains.",
        "3": "Useful content exists but can be merged/compressed without loss.",
        "4": "Strong necessity with a bounded weakness that has a clear repair.",
        "5": "Removal would materially damage meaning, evidence, or necessary linkage."
      }
    },
    {
      "id": "S03",
      "name": "Information contribution",
      "level": "sentence",
      "definition": "Whether the sentence contributes genuine new information or a purposeful restatement.",
      "applicable_modes": [
        "DRAFT_FROM_EVIDENCE",
        "REVISE_PRESERVE_MEANING",
        "DIAGNOSE_ONLY",
        "SCORE_ONLY",
        "COMPARE_VARIANTS",
        "FIT_ADAPT"
      ],
      "source_basis": [
        "repo_design",
        "gopen_swan"
      ],
      "not_assessed_when": [
        "paragraph_context_missing"
      ],
      "anchors": {
        "1": "Redundant paraphrase with no transition function.",
        "2": "Substantial information contribution weakness; some usable function/evidence remains.",
        "3": "Some new information, but overlap or purpose is unclear.",
        "4": "Strong information contribution with a bounded weakness that has a clear repair.",
        "5": "Adds needed information or an intentional bridge without redundant restatement."
      }
    },
    {
      "id": "S04",
      "name": "Claim-evidence support",
      "level": "sentence",
      "definition": "Whether a substantive claim is supported by relevant supplied/verified evidence.",
      "applicable_modes": [
        "DRAFT_FROM_EVIDENCE",
        "REVISE_PRESERVE_MEANING",
        "DIAGNOSE_ONLY",
        "SCORE_ONLY",
        "COMPARE_VARIANTS",
        "FIT_ADAPT"
      ],
      "source_basis": [
        "repo_design",
        "moskal_leydens"
      ],
      "not_assessed_when": [
        "sentence_has_no_substantive_claim",
        "evidence_packet_missing"
      ],
      "anchors": {
        "1": "Material claim is unsupported or contradicted.",
        "2": "Substantial claim-evidence support weakness; some usable function/evidence remains.",
        "3": "Evidence is relevant but incomplete/indirect for the claim as written.",
        "4": "Strong claim-evidence support with a bounded weakness that has a clear repair.",
        "5": "Evidence directly and proportionately supports the claim at this scope."
      }
    },
    {
      "id": "S05",
      "name": "Detail sufficiency",
      "level": "sentence",
      "definition": "Whether enough concrete detail is present to support the sentence's job.",
      "applicable_modes": [
        "DRAFT_FROM_EVIDENCE",
        "REVISE_PRESERVE_MEANING",
        "DIAGNOSE_ONLY",
        "SCORE_ONLY",
        "COMPARE_VARIANTS",
        "FIT_ADAPT"
      ],
      "source_basis": [
        "repo_design",
        "better_writing"
      ],
      "not_assessed_when": [
        "sentence_role_requires_no_detail"
      ],
      "anchors": {
        "1": "Generic wording prevents the reader from assessing the claim/action.",
        "2": "Substantial detail sufficiency weakness; some usable function/evidence remains.",
        "3": "Some concrete detail exists but an important relation remains vague.",
        "4": "Strong detail sufficiency with a bounded weakness that has a clear repair.",
        "5": "Detail is sufficient to support the job without relying on generic labels."
      }
    },
    {
      "id": "S06",
      "name": "Detail excess",
      "level": "sentence",
      "definition": "Whether detail consumes attention without increasing support or meaning.",
      "applicable_modes": [
        "DRAFT_FROM_EVIDENCE",
        "REVISE_PRESERVE_MEANING",
        "DIAGNOSE_ONLY",
        "SCORE_ONLY",
        "COMPARE_VARIANTS",
        "FIT_ADAPT"
      ],
      "source_basis": [
        "repo_design"
      ],
      "not_assessed_when": [
        "sentence_context_missing"
      ],
      "anchors": {
        "1": "Minor/technical detail dominates the sentence and obscures the point.",
        "2": "Substantial detail excess weakness; some usable function/evidence remains.",
        "3": "Mostly useful detail with some avoidable load.",
        "4": "Strong detail excess with a bounded weakness that has a clear repair.",
        "5": "Every retained detail materially supports evidence, causality, ownership, or reader understanding."
      }
    },
    {
      "id": "S07",
      "name": "Rhetorical weight",
      "level": "sentence",
      "definition": "Whether length, specificity, clause structure, and stress match information importance.",
      "applicable_modes": [
        "DRAFT_FROM_EVIDENCE",
        "REVISE_PRESERVE_MEANING",
        "DIAGNOSE_ONLY",
        "SCORE_ONLY",
        "COMPARE_VARIANTS",
        "FIT_ADAPT"
      ],
      "source_basis": [
        "gopen_swan",
        "repo_design"
      ],
      "not_assessed_when": [
        "paragraph_context_missing"
      ],
      "anchors": {
        "1": "Minor support is overweighted or the main turn is buried.",
        "2": "Substantial rhetorical weight weakness; some usable function/evidence remains.",
        "3": "Importance is visible but sentence stress/weight is uneven.",
        "4": "Strong rhetorical weight with a bounded weakness that has a clear repair.",
        "5": "Structural emphasis matches substantive importance and lands the intended point."
      }
    },
    {
      "id": "S08",
      "name": "Lexical precision",
      "level": "sentence",
      "definition": "Whether words express the intended relation without abstraction, inflation, or terminology drift.",
      "applicable_modes": [
        "DRAFT_FROM_EVIDENCE",
        "REVISE_PRESERVE_MEANING",
        "DIAGNOSE_ONLY",
        "SCORE_ONLY",
        "COMPARE_VARIANTS",
        "FIT_ADAPT"
      ],
      "source_basis": [
        "repo_design",
        "better_writing"
      ],
      "not_assessed_when": [
        "language_not_assessable"
      ],
      "anchors": {
        "1": "Key wording is inaccurate, inflated, or obscures the intended relation.",
        "2": "Substantial lexical precision weakness; some usable function/evidence remains.",
        "3": "Meaning is recoverable but some wording is vague or imprecise.",
        "4": "Strong lexical precision with a bounded weakness that has a clear repair.",
        "5": "Words state the intended relation directly and at the correct technical strength."
      }
    },
    {
      "id": "S09",
      "name": "Epistemic calibration",
      "level": "sentence",
      "definition": "Whether certainty, causal verbs, hedges, and modifiers match the evidence ceiling.",
      "applicable_modes": [
        "DRAFT_FROM_EVIDENCE",
        "REVISE_PRESERVE_MEANING",
        "DIAGNOSE_ONLY",
        "SCORE_ONLY",
        "COMPARE_VARIANTS",
        "FIT_ADAPT"
      ],
      "source_basis": [
        "repo_design",
        "scientific_writing"
      ],
      "not_assessed_when": [
        "no_epistemic_claim"
      ],
      "anchors": {
        "1": "Certainty/causality materially exceeds evidence or hedging hides a supported claim.",
        "2": "Substantial epistemic calibration weakness; some usable function/evidence remains.",
        "3": "Overall calibrated but with one notable over/understatement.",
        "4": "Strong epistemic calibration with a bounded weakness that has a clear repair.",
        "5": "Certainty and qualification precisely match what the evidence can support."
      }
    },
    {
      "id": "PAIR01",
      "name": "Backward linkage",
      "level": "sentence_pair",
      "definition": "Whether the second sentence connects to information made available by the first.",
      "applicable_modes": [
        "DRAFT_FROM_EVIDENCE",
        "REVISE_PRESERVE_MEANING",
        "DIAGNOSE_ONLY",
        "SCORE_ONLY",
        "COMPARE_VARIANTS",
        "FIT_ADAPT"
      ],
      "source_basis": [
        "gopen_swan"
      ],
      "not_assessed_when": [
        "adjacent_pair_unavailable"
      ],
      "anchors": {
        "1": "Second sentence feels orphaned or abandons the prior premise.",
        "2": "Substantial backward linkage weakness; some usable function/evidence remains.",
        "3": "Connection is inferable but weak or unnecessarily implicit.",
        "4": "Strong backward linkage with a bounded weakness that has a clear repair.",
        "5": "The second sentence consumes prior context naturally without mechanical signposting."
      }
    },
    {
      "id": "PAIR02",
      "name": "Scope continuity",
      "level": "sentence_pair",
      "definition": "Whether changes in time, object, mechanism, or level are bridged adequately.",
      "applicable_modes": [
        "DRAFT_FROM_EVIDENCE",
        "REVISE_PRESERVE_MEANING",
        "DIAGNOSE_ONLY",
        "SCORE_ONLY",
        "COMPARE_VARIANTS",
        "FIT_ADAPT"
      ],
      "source_basis": [
        "gopen_swan",
        "repo_design"
      ],
      "not_assessed_when": [
        "adjacent_pair_unavailable"
      ],
      "anchors": {
        "1": "Abrupt scope/chronology shift changes the object of discussion without a bridge.",
        "2": "Substantial scope continuity weakness; some usable function/evidence remains.",
        "3": "Shift is understandable but costs reader effort.",
        "4": "Strong scope continuity with a bounded weakness that has a clear repair.",
        "5": "Any scope shift is deliberate, bounded, and easy to follow."
      }
    },
    {
      "id": "PAIR03",
      "name": "Relation clarity",
      "level": "sentence_pair",
      "definition": "Whether causal, contrastive, chronological, or elaborative relation is correct and legible.",
      "applicable_modes": [
        "DRAFT_FROM_EVIDENCE",
        "REVISE_PRESERVE_MEANING",
        "DIAGNOSE_ONLY",
        "SCORE_ONLY",
        "COMPARE_VARIANTS",
        "FIT_ADAPT"
      ],
      "source_basis": [
        "repo_design"
      ],
      "not_assessed_when": [
        "adjacent_pair_unavailable"
      ],
      "anchors": {
        "1": "Relation is wrong or materially ambiguous.",
        "2": "Substantial relation clarity weakness; some usable function/evidence remains.",
        "3": "Relation is mostly clear but one inference is underspecified.",
        "4": "Strong relation clarity with a bounded weakness that has a clear repair.",
        "5": "The relation is accurate and clear without unnecessary transition words."
      }
    },
    {
      "id": "PAIR04",
      "name": "Terminology continuity",
      "level": "sentence_pair",
      "definition": "Whether referring terms remain stable enough for the reader to track entities/concepts.",
      "applicable_modes": [
        "DRAFT_FROM_EVIDENCE",
        "REVISE_PRESERVE_MEANING",
        "DIAGNOSE_ONLY",
        "SCORE_ONLY",
        "COMPARE_VARIANTS",
        "FIT_ADAPT"
      ],
      "source_basis": [
        "repo_design"
      ],
      "not_assessed_when": [
        "adjacent_pair_unavailable"
      ],
      "anchors": {
        "1": "Terminology drift creates ambiguity or suggests a different concept.",
        "2": "Substantial terminology continuity weakness; some usable function/evidence remains.",
        "3": "Mostly stable with a minor unnecessary synonym/shift.",
        "4": "Strong terminology continuity with a bounded weakness that has a clear repair.",
        "5": "Terms change only when meaning changes; referents remain unmistakable."
      }
    },
    {
      "id": "P01",
      "name": "Primary job clarity",
      "level": "paragraph",
      "definition": "Whether the paragraph has one dominant rhetorical job.",
      "applicable_modes": [
        "DRAFT_FROM_EVIDENCE",
        "REVISE_PRESERVE_MEANING",
        "DIAGNOSE_ONLY",
        "SCORE_ONLY",
        "COMPARE_VARIANTS",
        "FIT_ADAPT"
      ],
      "source_basis": [
        "repo_design"
      ],
      "not_assessed_when": [
        "paragraph_missing"
      ],
      "anchors": {
        "1": "No dominant job; paragraph is a mixed inventory.",
        "2": "Substantial primary job clarity weakness; some usable function/evidence remains.",
        "3": "A primary job exists but competes with secondary work.",
        "4": "Strong primary job clarity with a bounded weakness that has a clear repair.",
        "5": "The paragraph's primary job is clear and secondary material supports it."
      }
    },
    {
      "id": "P02",
      "name": "Internal logic",
      "level": "paragraph",
      "definition": "Whether the paragraph's internal relations form a coherent sequence.",
      "applicable_modes": [
        "DRAFT_FROM_EVIDENCE",
        "REVISE_PRESERVE_MEANING",
        "DIAGNOSE_ONLY",
        "SCORE_ONLY",
        "COMPARE_VARIANTS",
        "FIT_ADAPT"
      ],
      "source_basis": [
        "repo_design",
        "gopen_swan"
      ],
      "not_assessed_when": [
        "paragraph_missing"
      ],
      "anchors": {
        "1": "Events/claims are listed or causally mismatched.",
        "2": "Substantial internal logic weakness; some usable function/evidence remains.",
        "3": "Sequence is usable but one relation/bridge is weak.",
        "4": "Strong internal logic with a bounded weakness that has a clear repair.",
        "5": "The paragraph follows a coherent evidence-bounded relation appropriate to its job."
      }
    },
    {
      "id": "P03",
      "name": "Evidence-to-function adequacy",
      "level": "paragraph",
      "definition": "Whether evidence is sufficient for the paragraph's important claims and job.",
      "applicable_modes": [
        "DRAFT_FROM_EVIDENCE",
        "REVISE_PRESERVE_MEANING",
        "DIAGNOSE_ONLY",
        "SCORE_ONLY",
        "COMPARE_VARIANTS",
        "FIT_ADAPT"
      ],
      "source_basis": [
        "moskal_leydens",
        "repo_design"
      ],
      "not_assessed_when": [
        "evidence_not_required_for_job"
      ],
      "anchors": {
        "1": "Important paragraph claims lack support.",
        "2": "Substantial evidence-to-function adequacy weakness; some usable function/evidence remains.",
        "3": "Evidence supports the core job but one important claim/detail is under-supported.",
        "4": "Strong evidence-to-function adequacy with a bounded weakness that has a clear repair.",
        "5": "Evidence is sufficient and proportionate for all material paragraph claims."
      }
    },
    {
      "id": "P04",
      "name": "Detail allocation",
      "level": "paragraph",
      "definition": "Whether detail is distributed according to importance and signal value.",
      "applicable_modes": [
        "DRAFT_FROM_EVIDENCE",
        "REVISE_PRESERVE_MEANING",
        "DIAGNOSE_ONLY",
        "SCORE_ONLY",
        "COMPARE_VARIANTS",
        "FIT_ADAPT"
      ],
      "source_basis": [
        "repo_design"
      ],
      "not_assessed_when": [
        "paragraph_missing"
      ],
      "anchors": {
        "1": "Minor technical detail receives more space than the central turn.",
        "2": "Substantial detail allocation weakness; some usable function/evidence remains.",
        "3": "Weighting is mostly sensible but one detail is over/underweighted.",
        "4": "Strong detail allocation with a bounded weakness that has a clear repair.",
        "5": "Space and specificity track document importance and coverage opportunity cost."
      }
    },
    {
      "id": "P05",
      "name": "Local cohesion",
      "level": "paragraph",
      "definition": "Whether sentence pairs create a readable local flow.",
      "applicable_modes": [
        "DRAFT_FROM_EVIDENCE",
        "REVISE_PRESERVE_MEANING",
        "DIAGNOSE_ONLY",
        "SCORE_ONLY",
        "COMPARE_VARIANTS",
        "FIT_ADAPT"
      ],
      "source_basis": [
        "gopen_swan",
        "repo_design"
      ],
      "not_assessed_when": [
        "paragraph_has_fewer_than_two_sentences"
      ],
      "anchors": {
        "1": "Multiple pairwise breaks make the paragraph feel stitched together.",
        "2": "Substantial local cohesion weakness; some usable function/evidence remains.",
        "3": "Flow is usable with one noticeable local seam.",
        "4": "Strong local cohesion with a bounded weakness that has a clear repair.",
        "5": "Sentences link naturally while allowing deliberate shifts in emphasis."
      }
    },
    {
      "id": "P06",
      "name": "Narrative movement",
      "level": "paragraph",
      "definition": "Whether the paragraph changes the document state rather than merely describing events.",
      "applicable_modes": [
        "DRAFT_FROM_EVIDENCE",
        "REVISE_PRESERVE_MEANING",
        "DIAGNOSE_ONLY",
        "SCORE_ONLY",
        "COMPARE_VARIANTS",
        "FIT_ADAPT"
      ],
      "source_basis": [
        "repo_design",
        "addictive_writing"
      ],
      "not_assessed_when": [
        "paragraph_job_is_pure_reference"
      ],
      "anchors": {
        "1": "Paragraph adds activity but no change in question, judgment, capability, or argument.",
        "2": "Substantial narrative movement weakness; some usable function/evidence remains.",
        "3": "Some movement exists but consequence is weak or generic.",
        "4": "Strong narrative movement with a bounded weakness that has a clear repair.",
        "5": "The paragraph produces a supported consequence that advances the document's research story/argument."
      }
    },
    {
      "id": "P07",
      "name": "Redundancy",
      "level": "paragraph",
      "definition": "Whether the paragraph duplicates work already done elsewhere.",
      "applicable_modes": [
        "DRAFT_FROM_EVIDENCE",
