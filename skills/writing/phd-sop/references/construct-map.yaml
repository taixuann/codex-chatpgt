{
  "schema_version": 1,
  "groups": [
    {
      "id": "evidence_hierarchy",
      "members": [
        "S04",
        "P03",
        "D05"
      ],
      "rule": "Higher levels answer broader coverage questions; lower-level findings are evidence, not arithmetic votes."
    },
    {
      "id": "weight_hierarchy",
      "members": [
        "S07",
        "P04",
        "D06"
      ],
      "rule": "Sentence stress, paragraph detail allocation, and document hierarchy are related but distinct scopes."
    },
    {
      "id": "cohesion_hierarchy",
      "members": [
        "PAIR01",
        "PAIR02",
        "PAIR03",
        "PAIR04",
        "P05",
        "D15"
      ],
      "rule": "Pair findings support paragraph/global judgments; do not average pair scores into D15."
    },
    {
      "id": "trajectory_separation",
      "members": [
        "D03",
        "D14"
      ],
      "rule": "D03 concerns evolution of scientific questions/judgment; D14 concerns evolution of research practice."
    },
    {
      "id": "identity_behavior_separation",
      "members": [
        "D07",
        "D13"
      ],
      "rule": "Research identity is scientific problem-space; researcher legibility is evidence-backed behavior."
    },
    {
      "id": "evidence_calibration_separation",
      "members": [
        "S04",
        "S09",
        "G03"
      ],
      "rule": "S04 asks whether evidence exists; S09 asks whether language strength matches it; G03 blocks material overclaim."
    },
    {
      "id": "logic_movement_separation",
      "members": [
        "P02",
        "P06"
      ],
      "rule": "P02 asks whether internal relations are coherent; P06 asks whether the paragraph advances document state."
    },
    {
      "id": "narrative_science_causality",
      "members": [
        "PAIR03",
        "S09",
        "G03"
      ],
      "rule": "Narrative cause between events does not establish scientific mechanism causality."
    }
  ],
  "criteria_rules": {
    "D14": {
      "not_assessed_allowed": true,
      "do_not_require_recurrence": true
    },
    "D13": {
      "do_not_force_pattern": true
    },
    "S09": {
      "not_atomic_voice_rule": true
    }
  },
  "no_arithmetic_derivation": true
}