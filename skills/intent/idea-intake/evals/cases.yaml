skill: idea-intake
cases:
  - id: current-repo
    source: user
    prompt: "In this repository, clarify this feature idea using current evidence."
    expect: reuse_workspace
  - id: external-boundary
    source: user
    prompt: "Investigate this idea and consult an authoritative external standard if needed."
    expect: targeted_research
  - id: no-plan
    source: user
    prompt: "Turn my idea directly into an implementation task list."
    expect: no_match
