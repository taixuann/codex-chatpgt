schema_version: 1
kind: intent-agent-conformance-cases

# The execution agent sees only prompt. Expectations are reviewer-only.
cases:
  - {id: issue_focused_normal, origin: github_issue, depth: focused, capability: issue-intake, prompt: "Before planning, check the current GitHub Issue and explain what still matters."}
  - {id: issue_stale, origin: github_issue, depth: focused, capability: issue-intake, prompt: "Check whether this Issue is still true against the current repository."}
  - {id: issue_related_pr, origin: github_issue, depth: focused, capability: issue-intake, prompt: "Audit the Issue and see whether a related PR partially resolves it."}
  - {id: issue_user_decision, origin: github_issue, depth: focused, capability: intent-grill, prompt: "Review this Issue before we proceed and ask only for decisions I must make."}
  - {id: issue_no_relationships, origin: github_issue, depth: focused, capability: issue-intake, prompt: "Audit this Issue and explicitly tell me if no related work is found."}
  - {id: idea_existing_repo, origin: user_idea, depth: focused, capability: idea-intake, prompt: "I have an idea for this repository; figure out the current context before planning."}
  - {id: idea_simple_light, origin: user_idea, depth: light, capability: idea-intake, prompt: "Can we rename this one local label?"}
  - {id: idea_external_fact_needed, origin: user_idea, depth: focused, capability: idea-intake, prompt: "Assess this idea; one external standard may affect its boundary."}
  - {id: idea_no_external_research, origin: user_idea, depth: light, capability: idea-intake, prompt: "Use the current repository to assess this small idea."}
  - {id: idea_authority_gap, origin: user_idea, depth: focused, capability: intent-grill, prompt: "Explore this idea and ask me only about the trade-off I must choose."}
  - {id: idea_should_not_load_issue_audit, origin: user_idea, depth: light, capability: idea-intake, prompt: "I have a small idea; assess it without inventing an Issue."}
  - {id: light_should_not_load_deep_refs, origin: user_idea, depth: light, capability: idea-intake, prompt: "Give me a quick bounded read on this idea."}
  - {id: orientation_not_needed, origin: user_idea, depth: light, capability: idea-intake, prompt: "Is this trivial request clear enough to answer now?"}
  - {id: session_handoff_required, origin: github_issue, depth: focused, capability: issue-intake, prompt: "Prepare this Issue context so a fresh planner can continue later."}
  - {id: session_handoff_not_needed, origin: user_idea, depth: light, capability: idea-intake, prompt: "Answer this tiny idea without creating durable session state."}
  - {id: idea_deep_material_relationships, origin: user_idea, depth: deep, capability: idea-intake, material_relationships: true, prompt: "Investigate this idea deeply because related work was found."}
