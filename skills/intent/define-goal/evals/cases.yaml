version: 1
skill: define-goal
cases:
  - id: chosen-user-direction
    source: user
    prompt: "Turn this chosen direction into a measurable goal with acceptance criteria."
    expect: measurable-objective
  - id: clear-github-issue
    source: github_issue
    prompt: "Issue has a clear outcome and needs a bounded success bar."
    expect: preserve-locator-and-define
  - id: ordinary-build-negative
    source: user
    prompt: "Build the approved feature and commit it."
    expect: no-match
