version: 1
scope: tracked-control-plane-skills
cases:
  - id: bootstrap-project
    kind: positive
    prompt: Set up a new scientific file-first project with metadata and analysis folders.
    expected: project-bootstrap
    neighbors: [install-project-link, franky-guidance-manager]
  - id: guidance-only
    kind: negative
    prompt: Update AGENTS.md so analysis scripts preserve raw data.
    expected: franky-guidance-manager
    neighbors: [project-bootstrap]
  - id: link-existing-project
    kind: neighbor
    prompt: Link this existing project into the Codex workspace without copying its contents.
    expected: install-project-link
    neighbors: [project-bootstrap]
  - id: workflow-validation-only
    kind: negative
    prompt: Validate this workflow YAML and report schema errors.
    expected: none
    neighbors: [franky-maintenance]
  - id: persisted-workflow-design
    kind: negative
    prompt: Design a governed workflow with persisted gates and recovery for a scheduler consumer.
    expected: none
    neighbors: [franky-maintenance]
  - id: ordinary-coding
    kind: none
    prompt: Fix the parser bug in this application and run its unit tests.
    expected: none
    neighbors: [external-handoff, project-bootstrap]
  - id: ambiguous-setup
    kind: ambiguous
    prompt: Improve the setup around this project.
    expected: none
    neighbors: [project-bootstrap, franky-guidance-manager, install-project-link]
