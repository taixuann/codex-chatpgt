schema: franky.goal-session
version: 1
goal_id_pattern: '^GOAL-[0-9]{8}-[0-9]{3}$'
required_files: [GOAL.md, PLAN.md, TASKS.md, PROMOTION.yaml]
recommended_files: [context.md, walkthroughs, SESSION.yaml, revisions/current.yaml]
immutable_after_approval:
  - GOAL.md.id
  - GOAL.md.title
  - GOAL.md.goal_contract.objective
  - GOAL.md.goal_contract.scope
  - GOAL.md.goal_contract.non_goals
  - GOAL.md.goal_contract.acceptance_criteria
mutable_tracking:
  - GOAL.md.tracking
  - TASKS.md
  - walkthroughs/RUN-*.md
revision:
  directory: revisions
  snapshot_pattern: 'REV-[0-9]{3}.yaml'
  current_pointer: revisions/current.yaml
  pointer_fields: [revision_id, snapshot, sha256]
