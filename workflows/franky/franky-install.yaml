version: 1
id: WF-FRANKY-INSTALL
name: Franky installation entrypoint
invocation_policy: workflow_only
entrypoint: true
goal: Route one approved component request to exactly one Franky installation pipeline and finalize its evidence.
pipelines:
  - path: franky-install/skill.yaml
    branch: {key: component_type, value: skill}
  - path: franky-install/agent.yaml
    branch: {key: component_type, value: agent}
  - path: franky-install/workflow.yaml
    branch: {key: component_type, value: workflow}
  - path: franky-install/cron.yaml
    branch: {key: component_type, value: cron}
  - path: franky-install/guidance.yaml
    branch: {key: component_type, value: guidance}
  - path: franky-install/project-link.yaml
    branch: {key: component_type, value: project_link}
steps:
  - id: select-component
    skill: franky-maintenance
    operation: route_component
    inputs: [operator request, component_type, requested source and destination]
    outputs: [selected pipeline, route artifact]
    validation: [component_type matches exactly one declared branch]
    approval_gate: {required: false, reason: read_only_routing}
    on_failure: return_to_human
  - id: execute-selected-pipeline
    skill: franky-external-handoff
    operation: invoke_selected_pipeline
    inputs: [selected pipeline, route artifact, operator request]
    outputs: [pipeline result, changed-path manifest, validation report]
    validation: [only the selected nested pipeline is executed]
    approval_gate: {required: true, reason: governed_installation}
    on_failure: return_to_human
  - id: finalize-git
    skill: franky-maintenance
    operation: git_finalize
    inputs: [pipeline result, changed-path manifest, validation report]
    outputs: [local change commit, clean-tree report, optional agent changelog entry]
    validation: [allowlist, validators, commit, changelog, and clean-tree checks pass]
    approval_gate: {required: true, reason: local_control_plane_commit}
    on_failure: return_to_human
