version: 1
id: WF-FRANKY-MAINTENANCE-UPDATE-WORKFLOWS
name: Franky workflow maintenance pipeline
invocation_policy: workflow_only
branch: {key: maintenance_operation, value: update_workflows}
goal: Update nested Franky pipelines while preserving the two-family layout.
steps:
  - id: audit
    skill: franky-maintenance
    operation: audit_workflows
    inputs: [approved change context, selected workflow paths]
    outputs: [workflow layout report, dependency map]
    validation: [only two top-level workflow entrypoints are present]
    approval_gate: {required: false, reason: read_only_audit}
    on_failure: return_to_human
  - id: update
    skill: franky-workflow-organizer
    operation: update_approved_workflows
    inputs: [workflow layout report, dependency map, approved change context]
    outputs: [updated workflow pipelines, workflow version report]
    validation: [branch, step, artifact, and forbidden-key checks pass]
    approval_gate: {required: false, reason: approved_context}
    on_failure: return_to_human
  - id: validate
    skill: franky-maintenance
    operation: validate_workflows
    inputs: [updated workflow pipelines, change.yaml]
    outputs: [workflow validation report]
    validation: [entrypoint and all nested pipeline validators pass]
    approval_gate: {required: false, reason: validation_only}
    on_failure: return_to_human
