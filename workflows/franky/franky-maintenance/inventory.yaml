version: 1
id: WF-FRANKY-MAINTENANCE-INVENTORY
name: Franky control-plane inventory pipeline
invocation_policy: workflow_only
branch: {key: maintenance_operation, value: inventory}
goal: Produce a read-only inventory of the Franky control plane.
steps:
  - id: inventory
    skill: franky-maintenance
    operation: inventory
    inputs: [selected scope]
    outputs: [control-plane inventory]
    validation: [exact paths, versions, ownership, and source status are recorded]
    approval_gate: {required: false, reason: read_only_audit}
    on_failure: return_to_human
  - id: classify
    skill: franky-maintenance
    operation: classify
    inputs: [control-plane inventory]
    outputs: [classified findings, recommended maintenance operation]
    validation: [each finding has evidence, impact, and next action]
    approval_gate: {required: false, reason: analysis_only}
    on_failure: return_to_human
