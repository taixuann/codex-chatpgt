version: 1
id: WF-FRANKY-MAINTENANCE-MIGRATE-TO-CODEX
name: Franky cross-tool Codex migration pipeline
invocation_policy: workflow_only
branch: {key: maintenance_operation, value: migrate_to_codex}
goal: Detect, audit, normalize, and safely merge selected agent-tool artifacts into Codex.
dependencies:
  optional: [franky-source-migration, skill-creator, skill-installer]
steps:
  - id: detect
    skill: franky-source-migration
    operation: detect_sources
    inputs: [selected source roots]
    outputs: [source detection report]
    validation: [source identity and roots are explicit]
    approval_gate: {required: false, reason: read_only_discovery}
    on_failure: return_to_human
  - id: inventory
    skill: franky-source-migration
    operation: inventory_sources
    inputs: [source detection report, selected source roots]
    outputs: [artifact inventory, provenance records]
    validation: [paths, types, hashes, and active state are recorded]
    approval_gate: {required: false, reason: read_only_inventory}
    on_failure: return_to_human
  - id: audit
    skill: franky-maintenance
    operation: audit_migration_scope
    inputs: [artifact inventory, Codex control-plane inventory]
    outputs: [collision report, protected-path report, manual-review report]
    validation: [protected paths and unrelated repositories are excluded]
    approval_gate: {required: false, reason: read_only_audit}
    on_failure: return_to_human
  - id: normalize
    skill: franky-source-migration
    operation: normalize_artifacts
    inputs: [artifact inventory, source references, audit reports]
    outputs: [canonical artifact proposals, unsupported-item report]
    validation: [each proposal has a canonical category and target]
    approval_gate: {required: false, reason: proposal_only}
    on_failure: return_to_human
  - id: collision-review
    skill: franky-source-migration
    operation: detect_collisions
    inputs: [canonical artifact proposals, existing Codex inventory]
    outputs: [merge manifest, collision decisions]
    validation: [no overwrite is implicit; ambiguous items are manual review]
    approval_gate: {required: false, reason: proposal_only}
    on_failure: return_to_human
  - id: apply
    skill: franky-source-migration
    operation: apply_approved_manifest
    inputs: [approved migration manifest]
    outputs: [Codex artifacts, migration report]
    validation: [only approved targets are written]
    approval_gate: {required: false, reason: top_level_approval_context}
    on_failure: return_to_human
  - id: validate
    skill: franky-source-migration
    operation: validate_migration
    inputs: [migration manifest, generated Codex artifacts]
    outputs: [migration validation report]
    validation: [skill, agent, config, workflow, and allowlist validators pass]
    approval_gate: {required: false, reason: validation_only}
    on_failure: return_to_human
