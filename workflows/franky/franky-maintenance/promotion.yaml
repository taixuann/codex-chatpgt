version: 1
id: WF-FRANKY-MAINTENANCE-PROMOTION
name: Franky AI Labs promotion preparation pipeline
invocation_policy: workflow_only
branch: {key: maintenance_operation, value: prepare_promotion}
goal: Prepare an explicit, hashed, approval-gated promotion from Codex to AI Labs.
steps:
  - id: audit
    skill: franky-maintenance
    operation: audit_promotion_scope
    inputs: [approved change context, validated control-plane changes, clean-tree report]
    outputs: [promotion scope, destination registry map]
    validation: [only approved Franky packages and workflow metadata are included]
    approval_gate: {required: false, reason: read_only_audit}
    on_failure: return_to_human
  - id: prepare
    skill: franky-promotion
    operation: prepare_manifest
    inputs: [promotion scope, destination registry map, goal package, change commit]
    outputs: [proposed promotion manifest, promotion branch/update plan]
    validation: [hashes, dependencies, registries, destinations, and rollback agree]
    approval_gate: {required: false, reason: approved_context}
    on_failure: return_to_human
