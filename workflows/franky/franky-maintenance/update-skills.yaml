version: 1
id: WF-FRANKY-MAINTENANCE-UPDATE-SKILLS
name: Franky skill maintenance pipeline
invocation_policy: workflow_only
branch: {key: maintenance_operation, value: update_skills}
goal: Update approved Franky skill packages and record change evidence.
dependencies:
  optional: [skill-installer, openai-docs, review-agent]
steps:
  - id: audit
    skill: franky-maintenance
    operation: audit_skill
    inputs: [approved change context, selected scope]
    outputs: [skill collision report, dependency inventory]
    validation: [system-owned and unrelated paths are excluded]
    approval_gate: {required: false, reason: read_only_audit}
    on_failure: return_to_human
  - id: resolve-update-source
    skill: skill-installer
    operation: resolve_source
    condition: approved update source is curated or GitHub-based
    inputs: [selected scope, dependency inventory, approved change]
    outputs: [resolved update manifest, provenance evidence]
    validation: [source is supported; .system and unrelated paths are excluded]
    approval_gate: {required: false, reason: approved_context}
    on_failure: return_to_human
  - id: review-updated-skills
    skill: review-agent
    operation: review_proposed_package
    condition: independent external skill review is required and review-agent is available
    inputs: [updated skill proposal, provenance evidence, dependency inventory]
    outputs: [read-only review findings]
    validation: [review findings are returned before the update is finalized]
    approval_gate: {required: false, reason: read_only_review}
    on_failure: return_to_human
  - id: update
    skill: franky-skill-installer
    operation: update_approved_skills
    inputs: [skill collision report, dependency inventory, approved change]
    outputs: [updated skills, skill version report]
    validation: [quick_validate, interface, dependency, and hash checks pass]
    approval_gate: {required: false, reason: approved_context}
    on_failure: return_to_human
  - id: validate
    skill: franky-maintenance
    operation: validate_skills
    inputs: [updated skills, change.yaml]
    outputs: [skill validation report, changed-path manifest]
    validation: [all selected packages pass deterministic validators]
    approval_gate: {required: false, reason: validation_only}
    on_failure: return_to_human
