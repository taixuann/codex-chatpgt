version: 1
id: WF-FRANKY-GENERAL-WORKFLOW-FACTORY-FULL-PACKAGE
name: General workflow factory full package pipeline
invocation_policy: workflow_only
branch: {key: factory_operation, value: full_package}
goal: Generate coordinated workflow, skill, agent-binding, and registry proposals.
steps:
  - id: design
    skill: franky-workflow-factory
    operation: generate_package
    inputs: [qualified request, role registry, skill inventory, agent inventory]
    outputs: [workflow proposals, skill proposals, agent proposals, staged manifest]
    validation: [all proposed ownership, scope, and lifecycle routes are explicit]
    approval_gate: {required: false, reason: top_level_package_approval}
    on_failure: return_to_human
  - id: repair
    skill: franky-workflow-factory
    operation: repair_and_validate
    inputs: [staged package, flaw report]
    outputs: [repaired package, repair log, validation report]
    validation: [critical unresolved flaws block promotion]
    approval_gate: {required: false, reason: top_level_package_approval}
    on_failure: return_to_human
  - id: route
    skill: franky-workflow-factory
    operation: route_lifecycle_changes
    inputs: [validated package, existing lifecycle pipelines]
    outputs: [workflow, skill, agent, and registry route plan]
    validation: [no lifecycle implementation is duplicated or bypassed]
    approval_gate: {required: false, reason: top_level_package_approval}
    on_failure: return_to_human
