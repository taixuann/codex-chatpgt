version: 1
id: WF-FRANKY-CANONICAL
name: Franky unified control-plane workflow
invocation_policy: workflow_only
entrypoint: true
canonical: true
goal: Route one approved Franky control-plane operation through the shared lifecycle and a purpose-specific branch.
dependencies:
  resolution: installed_skill_name
  optional: [skill-installer, skill-creator, openai-docs, review-agent]
  protected: [.system, credentials, linked-projects]
lifecycle_ref:
  path: lifecycle-contract.yaml
  workflow_id: WF-FRANKY-CANONICAL-LIFECYCLE
  workflow_version: 1
branch_keys: [component_type, maintenance_operation]
retired_entrypoint_ids:
  - WF-FRANKY-INSTALL
  - WF-FRANKY-MAINTENANCE
pipelines:
  - path: franky-install/skill.yaml
    branch: {key: component_type, value: skill}
  - path: franky-install/agent.yaml
    branch: {key: component_type, value: agent}
  - path: franky-install/workflow.yaml
    branch: {key: component_type, value: workflow}
  - path: franky-install/cron.yaml
    branch: {key: component_type, value: cron}
  - path: franky-install/guidance.yaml
    branch: {key: component_type, value: guidance}
  - path: franky-install/project-link.yaml
    branch: {key: component_type, value: project_link}
  - path: franky-maintenance/inventory.yaml
    branch: {key: maintenance_operation, value: inventory}
  - path: franky-maintenance/update-skills.yaml
    branch: {key: maintenance_operation, value: update_skills}
  - path: franky-maintenance/update-agents.yaml
    branch: {key: maintenance_operation, value: update_agents}
  - path: franky-maintenance/update-workflows.yaml
    branch: {key: maintenance_operation, value: update_workflows}
  - path: franky-maintenance/update-cron.yaml
    branch: {key: maintenance_operation, value: update_cron}
  - path: franky-maintenance/update-guidance.yaml
    branch: {key: maintenance_operation, value: update_guidance}
  - path: franky-maintenance/promotion.yaml
    branch: {key: maintenance_operation, value: prepare_promotion}
  - path: franky-maintenance/git-finalize.yaml
    branch: {key: maintenance_operation, value: git_finalize}
  - path: franky-maintenance/migrate-to-codex.yaml
    branch: {key: maintenance_operation, value: migrate_to_codex}
steps:
  - id: qualify
    skill: franky-maintenance
    operation: qualify_request
    inputs: [operator request, purpose, selected branch]
    outputs: [qualified scope, workflow-run envelope]
    validation: [scope, role, change ID, workflow ID/version, and handoff target are explicit]
    approval_gate: {required: false, reason: read_only_routing}
    on_failure: return_to_human
  - id: audit
    skill: franky-maintenance
    operation: audit_scope
    inputs: [qualified scope, selected branch]
    outputs: [audit report, collision and dependency report]
    validation: [protected paths and unrelated paths are excluded]
    approval_gate: {required: false, reason: read_only_audit}
    on_failure: return_to_human
  - id: preview
    skill: franky-maintenance
    operation: preview_change
    inputs: [audit report, requested change]
    outputs: [exact preview, preview digest, lifecycle handoff envelope]
    validation: [changed paths, rollback, purpose, and selected branch are deterministic]
    approval_gate: {required: false, reason: preview_only}
    on_failure: return_to_human
  - id: approve
    skill: franky-maintenance
    operation: approve_exact_preview
    inputs: [exact preview, preview digest, rollback plan, lifecycle handoff envelope]
    outputs: [approval record]
    validation: [approval binds exactly to the preview digest and handoff scope]
    approval_gate: {required: true, reason: exact_preview_approval}
    on_failure: return_to_human
  - id: apply
    skill: franky-maintenance
    operation: execute_approved_branch
    inputs: [approved change context, selected branch, lifecycle handoff envelope]
    outputs: [purpose result, changed paths, lifecycle handoff envelope]
    validation: [only the selected branch executes in approved context, lifecycle target is explicit]
    approval_gate: {required: false, reason: approved_context}
    on_failure: return_to_human
  - id: validate
    skill: franky-maintenance
    operation: validate_result
    inputs: [purpose result, changed paths, approved preview]
    outputs: [validation report]
    validation: [component, workflow, change-record, and allowlist validators pass]
    approval_gate: {required: false, reason: validation_only}
    on_failure: return_to_human
  - id: overview
    skill: franky-maintenance
    operation: assess_control_plane_impact
    inputs: [validation report, changed paths, approved preview]
    outputs: [overview and impact report]
    validation: [impacted consumers, producers, and unresolved references are explicit]
    approval_gate: {required: false, reason: impact_review}
    on_failure: return_to_human
  - id: write-change-record
    skill: franky-maintenance
    operation: write_change_record
    inputs: [approved preview, approval record, validation report, changed paths]
    outputs: [change.yaml]
    validation: [schema, exact-preview, forbidden-path, rollback, and no-result checks pass]
    approval_gate: {required: false, reason: evidence_recording}
    on_failure: return_to_human
  - id: local-git-finalize
    skill: franky-maintenance
    operation: git_finalize
    inputs: [change.yaml, changed paths, validation report]
    outputs: [local Git finalize report]
    validation: [Git allowlist passes; local-only finalize is recorded; no push occurs]
    approval_gate: {required: false, reason: local_finalize}
    on_failure: return_to_human
