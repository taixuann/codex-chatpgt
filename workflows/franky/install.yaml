version: 1
id: WF-FRANKY-UNIFIED-INSTALL
name: Franky Unified Component Installer & Pre-Flight Router
category: franky
goal: Unified installation pipeline with pre-flight skill availability routing, impact propagation, and runtime deployment.
inputs:
  component_type:
    type: string
    description: Type of component to install
    enum:
      - skill
      - agent
      - workflow
      - cron
      - guidance
      - project_link
  target_name:
    type: string
    description: Name or path of the target component
outputs:
  install_report:
    type: object
    description: Summary of installation, router decision, impact propagation, and deployment status
steps:
  - id: check_skill_availability
    name: Pre-Flight Skill Availability & Overlap Check
    inputs:
      target_name: "${inputs.target_name}"
    decision_logic: "Execute find_skill.py to compare request against canonical ops/skills/ and active runtime state"
    validation_gate:
      assert_exit_code: 0
    outputs:
      router_decision: "CASE 1 (CREATE) or CASE 2 (UPDATE/MIGRATE)"
    reasoning_agent: franky
    execution_agent: shared.execution/external-handoff

  - id: qualify_component
    name: Qualify Component Type & Scope
    inputs:
      component_type: "${inputs.component_type}"
      target_name: "${inputs.target_name}"
      router_decision: "${steps.check_skill_availability.outputs.router_decision}"
    decision_logic: "Route component to appropriate installer script based on component_type and router decision"
    validation_gate:
      assert_exit_code: 0
    outputs:
      qualified_target: "Qualified path"
    reasoning_agent: franky
    execution_agent: shared.execution/external-handoff

  - id: audit_and_deploy
    name: Audit Component & Deploy to Target Runtimes
    inputs:
      qualified_target: "${steps.qualify_component.outputs.qualified_target}"
    decision_logic: "Execute deploy_skill.py or deploy_agent.py to install component"
    validation_gate:
      assert_exit_code: 0
    outputs:
      deployment_status: "Deployed paths"
    reasoning_agent: franky
    execution_agent: shared.execution/external-handoff

  - id: propagate_impact
    name: Multi-Asset Impact Propagation
    inputs:
      deployment_status: "${steps.audit_and_deploy.outputs.deployment_status}"
    decision_logic: "Update associated YAML workflows, agent specs, and ops/skills/AGENTS.md index"
    validation_gate:
      assert_exit_code: 0
    outputs:
      propagated_assets: "List of updated dependent assets"
    reasoning_agent: franky
    execution_agent: shared.execution/external-handoff

  - id: sync_and_validate
    name: Multi-Platform Sync & System Validation
    inputs:
      propagated_assets: "${steps.propagate_impact.outputs.propagated_assets}"
    decision_logic: "Run sync_multi_platform.py --antigravity --codex and validate_all.py"
    validation_gate:
      assert_exit_code: 0
    outputs:
      install_report: "Final installation report"
    reasoning_agent: franky
    execution_agent: shared.execution/external-handoff

invocation_policy: workflow_only
entrypoint: false
