version: 1
id: WF-FRANKY-GENERAL-WORKFLOW-FACTORY
name: Franky general workflow factory
invocation_policy: workflow_only
entrypoint: true
goal: Design, audit, stage, approve, and route role-aware workflow packages.
dependencies:
  resolution: installed_skill_name
  optional: [franky-workflow-organizer, franky-skill-installer, franky-agent-installer, franky-guidance-manager]
  protected: [.system, credentials, linked-projects]
pipelines:
  - path: general-workflow-factory/workflow-only.yaml
    branch: {key: factory_operation, value: workflow_only}
  - path: general-workflow-factory/workflow-with-skills.yaml
    branch: {key: factory_operation, value: workflow_with_skills}
  - path: general-workflow-factory/full-package.yaml
    branch: {key: factory_operation, value: full_package}
steps:
  - id: qualify
    skill: franky-maintenance
    operation: qualify_factory_request
    inputs: [operator request, factory_operation, selected role targets]
    outputs: [qualified scope, workflow-run envelope]
    validation: [role, request ID, workflow ID/version, and staged output root are explicit]
    approval_gate: {required: false, reason: read_only_routing}
    on_failure: return_to_human
  - id: audit
    skill: franky-workflow-factory
    operation: audit_request
    inputs: [qualified request, role registry, skill inventory, referenced artifacts]
    outputs: [inventory report, collision report, dependency report, flaw report]
    validation: [protected paths and unregistered roles are rejected]
    approval_gate: {required: false, reason: read_only_audit}
    on_failure: return_to_human
  - id: preview
    skill: franky-workflow-factory
    operation: generate_package
    inputs: [audit report, intent, references, selected factory pipeline]
    outputs: [staged package, exact preview, package digest, rollback plan]
    validation: [package is under workflows/temp and final paths are unchanged]
    approval_gate: {required: false, reason: proposal_only}
    on_failure: return_to_human
  - id: approve
    skill: franky-maintenance
    operation: approve_exact_preview
    inputs: [staged manifest, package digest, exact preview, rollback plan]
    outputs: [package approval record]
    validation: [approval binds exactly to staged package digest]
    approval_gate: {required: true, reason: exact_package_approval}
    on_failure: return_to_human
  - id: apply
    skill: franky-workflow-factory
    operation: promote_approved_package
    inputs: [approved package, selected lifecycle pipelines]
    outputs: [promoted artifacts, changed paths]
    validation: [workflow, skill, agent, and registry changes use existing lifecycle validators]
    approval_gate: {required: false, reason: approved_context}
    on_failure: return_to_human
  - id: validate
    skill: franky-maintenance
    operation: validate_factory_package
    inputs: [promoted artifacts, changed paths, approved package]
    outputs: [validation report]
    validation: [workflow, skill-interface, agent, allowlist, and registry checks pass]
    approval_gate: {required: false, reason: validation_only}
    on_failure: return_to_human
  - id: overview
    skill: franky-maintenance
    operation: assess_factory_impact
    inputs: [validation report, changed paths, approved package]
    outputs: [role, skill, workflow, agent, and registry impact report]
    validation: [all consumers, producers, and unresolved references are explicit]
    approval_gate: {required: false, reason: impact_review}
    on_failure: return_to_human
  - id: write-change-record
    skill: franky-maintenance
    operation: write_change_record
    inputs: [approved package, validation report, changed paths]
    outputs: [change.yaml]
    validation: [exact-preview, forbidden-path, rollback, and no-result checks pass]
    approval_gate: {required: false, reason: evidence_recording}
    on_failure: return_to_human
  - id: local-git-finalize
    skill: franky-maintenance
    operation: git_finalize
    inputs: [change.yaml, changed paths, validation report]
    outputs: [local Git finalize report]
    validation: [allowlist passes; local-only finalize is recorded; no push occurs]
    approval_gate: {required: false, reason: local_finalize}
    on_failure: return_to_human
