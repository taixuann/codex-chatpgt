version: 1
id: WF-FRANKY-MAINTENANCE
name: Franky maintenance entrypoint
invocation_policy: workflow_only
entrypoint: true
goal: Audit, update, validate, version, log, commit, and prepare promotion for the Franky control plane.
pipelines:
  - path: franky-maintenance/inventory.yaml
    branch: {key: maintenance_operation, value: inventory}
  - path: franky-maintenance/update-skills.yaml
    branch: {key: maintenance_operation, value: update_skills}
  - path: franky-maintenance/update-agents.yaml
    branch: {key: maintenance_operation, value: update_agents}
  - path: franky-maintenance/update-workflows.yaml
    branch: {key: maintenance_operation, value: update_workflows}
  - path: franky-maintenance/update-cron.yaml
    branch: {key: maintenance_operation, value: update_cron}
  - path: franky-maintenance/update-guidance.yaml
    branch: {key: maintenance_operation, value: update_guidance}
  - path: franky-maintenance/promotion.yaml
    branch: {key: maintenance_operation, value: prepare_promotion}
  - path: franky-maintenance/git-finalize.yaml
    branch: {key: maintenance_operation, value: git_finalize}
steps:
  - id: select-maintenance-operation
    skill: franky-maintenance
    operation: route_maintenance
    inputs: [maintenance request, maintenance_operation, selected scope]
    outputs: [selected maintenance pipeline, route artifact]
    validation: [maintenance_operation matches exactly one declared branch]
    approval_gate: {required: false, reason: read_only_routing}
    on_failure: return_to_human
  - id: execute-selected-pipeline
    skill: franky-external-handoff
    operation: invoke_selected_pipeline
    inputs: [selected maintenance pipeline, route artifact, approved goal package]
    outputs: [pipeline result, changed-path manifest, validation report]
    validation: [only the selected nested pipeline is executed]
    approval_gate: {required: true, reason: governed_maintenance}
    on_failure: return_to_human
  - id: finalize-git
    skill: franky-maintenance
    operation: git_finalize
    inputs: [pipeline result, changed-path manifest, validation report]
    outputs: [local change commit, clean-tree report, agent changelog entry when applicable]
    validation: [allowlist, validators, commit, changelog, and clean-tree checks pass]
    approval_gate: {required: true, reason: local_control_plane_commit}
    on_failure: return_to_human
