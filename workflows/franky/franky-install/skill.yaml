version: 1
id: WF-FRANKY-SKILL-LIFECYCLE
name: Franky skill lifecycle
invocation_policy: workflow_only
branch: {key: component_type, value: skill}
goal: Govern one Franky skill from candidate capability through validation and optional promotion.
dependencies:
  optional: [skill-installer, skill-creator, openai-docs, review-agent]
steps:
  - id: audit-skill
    skill: franky-maintenance
    operation: audit_skill
    inputs: [approved change context, candidate source, target scope]
    outputs: [collision report, dependency inventory, provenance report]
    validation: [system-owned paths and unsupported sources are rejected]
    approval_gate: {required: false, reason: read_only_audit}
    on_failure: return_to_human
  - id: resolve-external-source
    skill: skill-installer
    operation: resolve_source
    condition: requested source is curated or GitHub-based
    inputs: [candidate source, target scope, dependency inventory]
    outputs: [resolved source manifest, provenance evidence]
    validation: [source is supported; destination is outside .system; provenance is recorded]
    approval_gate: {required: false, reason: approved_context}
    on_failure: return_to_human
  - id: scaffold-local-skill
    skill: skill-creator
    operation: scaffold_skill
    condition: requested change creates a new local skill
    inputs: [approved skill name, resource requirements, target scope]
    outputs: [scaffolded skill package]
    validation: [package name and target are allowed; .system is unchanged]
    approval_gate: {required: false, reason: approved_context}
    on_failure: return_to_human
  - id: review-skill-package
    skill: review-agent
    operation: review_proposed_package
    condition: independent external package review is required and review-agent is available
    inputs: [skill package proposal, provenance evidence, dependency inventory]
    outputs: [read-only review findings]
    validation: [review is complete; findings are returned before mutation]
    approval_gate: {required: false, reason: read_only_review}
    on_failure: return_to_human
  - id: prepare-skill-change
    skill: skill-installer
    operation: plan_change
    inputs: [collision report, dependency inventory, candidate skill]
    outputs: [skill package proposal, rollback plan]
    validation: [frontmatter, interface metadata, resources, and dependencies pass]
    approval_gate: {required: false, reason: approved_context}
    on_failure: return_to_human
  - id: apply-skill-change
    skill: skill-installer
    operation: apply_change
    inputs: [approved skill package proposal, rollback plan]
    outputs: [updated skill package]
    validation: [package is at the approved path and .system is unchanged]
    approval_gate: {required: false, reason: approved_context}
    on_failure: return_to_human
  - id: validate-skill
    skill: franky-maintenance
    operation: validate_skill
    inputs: [updated skill package, dependency inventory]
    outputs: [skill validation report, artifact hash]
    validation: [quick_validate, interface, trigger-boundary, and dependency checks pass]
    approval_gate: {required: false, reason: validation_only}
    on_failure: return_to_human
