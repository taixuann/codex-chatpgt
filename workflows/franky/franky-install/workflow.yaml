version: 1
id: WF-FRANKY-WORKFLOW-LIFECYCLE
name: Franky workflow lifecycle
invocation_policy: workflow_only
branch: {key: component_type, value: workflow}
goal: Design, validate, register, revise, and retire an executor-agnostic Franky workflow contract.
dependencies:
  optional: [openai-docs, review-agent]
steps:
  - id: design-workflow
    skill: franky-workflow-organizer
    operation: design
    inputs: [approved change context, ordered capability steps, artifact contract]
    outputs: [workflow YAML proposal]
    validation: [workflow is thin, typed, executor-agnostic, and invocation_policy is workflow_only]
    approval_gate: {required: false, reason: approved_context}
    on_failure: return_to_human
  - id: validate-workflow
    skill: franky-workflow-organizer
    operation: validate
    inputs: [workflow YAML proposal, installed skill inventory]
    outputs: [workflow validation report, referenced-skill map]
    validation: [schema, cross-references, typed gates, and recursive forbidden-key checks pass]
    approval_gate: {required: false, reason: validation_only}
    on_failure: return_to_human
  - id: review-workflow
    skill: review-agent
    operation: review_proposed_workflow
    inputs: [workflow YAML proposal, workflow validation report, referenced-skill map]
    outputs: [read-only workflow review findings]
    validation: [forbidden keys, dependency scope, and branch routing are reviewed]
    approval_gate: {required: false, reason: read_only_review}
    on_failure: return_to_human
  - id: register-workflow
    skill: franky-maintenance
    operation: register
    inputs: [validated workflow, workflow catalog proposal]
    outputs: [registered workflow proposal, registry diff]
    validation: [workflow ID is unique and catalog mapping is explicit]
    approval_gate: {required: false, reason: approved_context}
    on_failure: return_to_human
