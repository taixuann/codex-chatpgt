version: 1
id: WF-FRANKY-INSTALL-GUIDANCE
name: Franky guidance installation pipeline
invocation_policy: workflow_only
branch: {key: component_type, value: guidance}
goal: Install or update one scoped AGENTS.md or guidance package.
steps:
  - id: audit-guidance
    skill: franky-maintenance
    operation: audit_guidance
    inputs: [approved change context, target guidance path]
    outputs: [instruction inventory, precedence report, collision report]
    validation: [no global persona stickiness or unrelated task coupling]
    approval_gate: {required: false, reason: read_only_audit}
    on_failure: return_to_human
  - id: apply-guidance
    skill: franky-guidance-manager
    operation: install_or_update
    inputs: [instruction inventory, approved guidance proposal, rollback plan]
    outputs: [updated guidance, guidance diff]
    validation: [only approved guidance paths changed]
    approval_gate: {required: false, reason: approved_context}
    on_failure: return_to_human
