schema_version: 1
id: CODEX-AGENT-CAPABILITY-REPERTOIRES-20260813
authority:
  primary: Issue #56
  skill_admission: Issue #38
  canonical_role_registry: external_ai_labs_deployment_registry
  canonical_role_definitions: external_ai_labs_deployment_definitions
  portable_role_reference: agents/AGENTS.md and documentation/architecture/agents.md
  local_runtime_registry_path: /Users/tai/ai-labs/ops/agents/agents.yaml
  repository_runtime_policy: AGENTS.md
  repository_adapters: agents/*.toml
  explanatory_documentation: documentation/
  precedence:
    - external_deployment_registry_when_available
    - portable_repository_role_reference
    - repository_adapters
    - repository_runtime_policy
    - explanatory_documentation
  update_procedure: >-
    Update the owning canonical definition first, then reconcile adapters and
    documentation in one reviewed work unit; do not infer role changes from a
    local adapter or create synchronization automation without a named consumer.
semantics:
  repertoire: approved, eligible, and preferred capabilities; not exclusive skill ownership
  explicit_invocation: named-agent selection overrides selection only, never scope or authority
  automatic_routing: capability-first parent routing remains separate from explicit invocation
agents:
  franky:
    role_surface: canonical
    primary_capabilities:
      - control-plane-audit
      - instruction-maintenance
      - runtime-adapter-management
      - external-handoff
      - session-packet-management
    lifecycle_capabilities:
      - shared-session-closeout
    conditional_capabilities:
      - project-bootstrap
    external_or_runtime_dependencies:
      - capability: skill-authoring-and-quality
        authority: Issue #38
        preferred_resolution: builtin/system skill-creator when available and admitted
        fallback: repository skill-quality contract or explicit handoff
        runtime_availability: MUST_PROBE
    forbidden_capabilities:
      - research-project-contents
      - recursive-subagent-orchestration
      - consequential-self-acceptance
  feynman:
    role_surface: canonical
    primary_capabilities:
      - scientific-reasoning
      - evidence-synthesis
      - methodology-critique
      - hypothesis-gap-analysis
      - source-verification
    global_reusable_procedures:
      - name: scientific-evidence-synthesis
        admission: ADAPT
        path: skills/research/scientific-evidence-synthesis
      - name: hypothesis-and-test-design
        admission: ADAPT
        path: skills/research/hypothesis-and-test-design
      - name: scientific-method-critique
        admission: ADAPT
        path: skills/research/scientific-method-critique
    knowledge_capabilities:
      personal_wiki:
        role: reusable_context
        runtime_availability: MUST_PROBE
      scientific_wiki:
        role: on_demand_literature_evidence
        authority: Issue #7
        runtime_availability: MUST_PROBE
    project_local_procedures:
      resolution: project_manifest
      copied_into_global_repository: false
    lifecycle_capabilities:
      - shared-session-closeout
    conditional_capabilities: []
    external_or_runtime_dependencies: []
    forbidden_capabilities:
      - project-mutation
      - final-scientific-acceptance
  prometheus:
    role_surface: canonical
    primary_capabilities:
